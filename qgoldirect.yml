              type: "string"
              description: "Session ID associated with the event."

    cfm_journey_completed_event:
      type: "object"
      properties:
        acceptanceInfo:
          type: "object"
          description: "Details of acceptance information."
          properties:
            deviceIP:
              type: "string"
              description: "IP address of the device."
            deviceInfo:
              type: "string"
              description: "Information about the device and browser used."
            id:
              type: "string"
              description: "ID of the acceptance event."
            timestamp:
              type: "string"
              format: "date-time"
              description: "Timestamp of the journey start."
            version:
              type: "string"
              description: "Version of the Terms and Conditions"
        caseID:
          type: "string"
          description: "ID of the case."
        caseTypeID:
          type: "string"
          description: "Type ID of the case."
        entityID:
          type: "string"
          description: "ID of the associated entity."
        journeyID:
          type: "string"
          description: "ID of the journey associated with the case."
        locale:
          type: "string"
          description: "Language setting for the case if selected by the user. EN is default"
        merchantID:
          type: "string"
          description: "This is your merchant identifier. It's your unique identifier across other QGen Online Merchants and never changes."
        referenceID:
          type: "string"
          description: "Reference ID associated with the case. You should send this. Make sure it is unique."
        riskLevelID:
          type: "string"
          description: "Risk level ID assigned to the case."
        sessionID:
          type: "string"
          description: "Session ID associated with the case. A session has a time-out."
        steps:
          type: "array"
          description: "List of steps in the journey as defined in the Risk settings."
          items:
            type: "object"
            properties:
              checkName:
                type: "string"
                description: "Name of the check step."
              checkType:
                type: "string"
                description: "Type of the check step. e.g. Identity Documents"
              completed:
                type: "boolean"
                description: "Truq if the step has been completed. False otherwise."
              completedAt:
                type: "string"
                format: "date-time"
                description: "Time when the step was completed."
              data:
                type: "object"
                properties:
                  candidate:
                    type: "object"
                    properties:
                      documentCountryCode:
                        type: "string"
                        description: "Country code of the document. e.g. MT"
                      documentCountryName:
                        type: "string"
                        description: "Country name of the document. e.g. Malta"
                      documentDescription:
                        type: "string"
                        description: "Description of the document. e.g. Identity Card"
                      documentName:
                        type: "string"
                        description: "Name of the document."
                      documentTypeDetail:
                        type: "string"
                        description: "Type detail of the document."
                      probability:
                        type: "number"
                        description: "Probability of the document that it's what we indicate it to be."
                  documentType:
                    type: "string"
                    description: "Type of the document."
                  documents:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        fileName:
                          type: "string"
                          description: "Name of the file associated with the document."
                        isUpload:
                          type: "boolean"
                          description: "True if the document was uploaded."
                        side:
                          type: "string"
                          description: "Side of the document. Front or Back"
                        size:
                          type: "integer"
                          description: "Size of the document file in bytes."
                  documentsSize:
                    type: "integer"
                    description: "Total size of all documents in bytes."
                  fastFail:
                    type: "boolean"
                    description: "True if the document passed the automated verdict during capture; false if it took the manual path. See capturePath."
                  capturePath:
                    type: "string"
                    enum: ["automated", "manual", "forced_manual"]
                    description: "The path the document took during capture. automated: the automated verdict ran and the document passed it. manual: the check skips the automated verdict (onOutcome always_refer). forced_manual: the automated attempts were exhausted and the applicant fell back to the manual path (onOutcome refer_on_fail). In every case the document is still processed and evaluated afterwards."
                  numberOfDocuments:
                    type: "integer"
                    description: "Number of documents involved in the step."
              deviceIP:
                type: "string"
                description: "IP address of the device used in the step."
              deviceInfo:
                type: "string"
                description: "Information about the device and browser used."
              documents:
                type: "array"
                description: >
                  One entry per grouped document produced by the step. `id` is the grouped document id — for
                  AML Screening steps that is the AML grouped document, not the certificate — and `documents[]`
                  are its files. The AML certificate is `documents[0].documents[0]`, with `documentType`
                  "AML Screening"; it is absent when no certificate was produced.
                items:
                  type: "object"
                  properties:
                    id:
                      type: "string"
                      description: "The grouped document id."
                    documents:
                      type: "array"
                      items:
                        type: "object"
                        properties:
                          id:
                            type: "string"
                            description: "File id. Use this with GET /v1/case/case/{caseId}/{docId}."
                          key:
                            type: "string"
                          fileName:
                            type: "string"
                          documentType:
                            type: "string"
                          documentSide:
                            type: "string"
                          mimeType:
                            type: "string"
                          extension:
                            type: "string"
                          size:
                            type: "number"
              faceLiveness:
                type: "object"
                properties:
                  UUID:
                    type: "string"
                    description: "UUID of the face liveness check."
                  completed:
                    type: "boolean"
                    description: "Whether the face liveness check is completed."
                  createdBy:
                    type: "object"
                    properties:
                      actorId:
                        type: "string"
                        description: "ID of the actor initiating the face liveness check."
                      actorType:
                        type: "string"
                        description: "Type of the actor initiating the face liveness check."
                      timestamp:
                        type: "string"
                        format: "date-time"
                        description: "Timestamp of the actor's action."
                  response:
                    type: "object"
                    properties:
                      capture_liveness:
                        type: "object"
                        properties:
                          probability:
                            type: "number"
                            description: "Probability score for the capture liveness."
                          score:
                            type: "number"
                            description: "Score for the capture liveness."
                      face_liveness:
                        type: "object"
                        properties:
                          probability:
                            type: "number"
                            description: "Probability score for the face liveness."
                  revisionID:
                    type: "integer"

                    description: "Revision ID of the face liveness response."
              stepNo:
                type: "integer"
                description: "Step number in the journey sequence."
    cfm_kyc_completed_event:
      description: >
        Full schema of KYC completed event. [See example here](https://arritechlabs.github.io/docs/examples/cfm_kyc_completed_event.json)


        Each step under `payload.steps` carries a `documents[]` array of `{id, documents[]}`. `id` is the step's
        grouped document id; the files sit one level down. For AML Screening steps the certificate is
        `documents[0].documents[0]`, with `documentType` "AML Screening" — `documents[0].id` is the grouped document
        and is not a downloadable file id. Events emitted before AML gained a grouped document carry the
        certificate's own document id in `documents[0].id` and an empty `documentType` on the file.
      type: "object"
      properties:
        base:
          type: "object"
          description: "Base event information common to all events."
          properties:
            merchantID:
              type: "string"
              description: "Your merchant identifier."
            referenceID:
              type: "string"
              description: "Unique reference ID for the event."
            sessionID:
              type: "string"
              description: "Session ID associated with the event."
            riskLevelID:
              type: "string"
              description: "Risk level ID assigned to the event."
            journeyID:
              type: "string"
              description: "Journey ID associated with the event."
            caseID:
              type: "string"
              description: "Case ID associated with the event."
            entityID:
              type: "string"
              description: "Entity ID related to the event."
            caseTypeID:
              type: "string"
              description: "Type ID of the case."
              nullable: true
            locale:
              type: "string"
              description: "Language setting for the case."
            webhooks:
              type: "array"
              description: "List of webhook configurations."
              items:
                type: "object"
                properties:
                  id:
                    type: "string"
                    description: "Unique ID of the webhook."
                  endpoint:
                    type: "string"
                    description: "Endpoint URL for the webhook."
                  retryCount:
                    type: "integer"
                    description: "Number of retries attempted for the webhook."
                  secretKey:
                    type: "string"
                    description: "Secret key for securing the webhook."
        payload:
          type: "object"
          description: "Details of the KYC completed event payload."
          properties:
            merchantId:
              type: "string"
              description: "Your merchant identifier."
            referenceId:
              type: "string"
              description: "Unique reference ID for the KYC."
            caseId:
              type: "string"
              description: "Case ID associated with the KYC."
            caseTypeId:
              type: "string"
              description: "Case type ID."
              nullable: true
            entityId:
              type: "string"
              description: "Entity ID related to the KYC."
            sessionId:
              type: "string"
              description: "Session ID associated with the KYC."
            journeyId:
              type: "string"
              description: "Journey ID associated with the KYC."
            clientId:
              type: "string"
              description: "Client ID related to the KYC."
            linkId:
              type: "string"
              description: "Link ID associated with the KYC."
            messageId:
              type: "string"
              description: "Optional message ID."
              nullable: true
            riskLevel:
              type: "string"
              description: "Risk level information."
            ipInfo:
              type: "object"
              description: "Details of the client's IP information."
              properties:
                IPAddress:
                  type: "string"
                  description: "IP address of the client."
                IPCountry:
                  type: "string"
                  description: "Country of the IP address."
                agentInfo:
                  type: "object"
                  description: "Information about the client's device and browser."
                  properties:
                    browser:
                      type: "string"
                      description: "Browser used by the client."
                    operatingSystem:
                      type: "string"
                      description: "Operating system of the client's device."
                    device:
                      type: "string"
                      description: "Device used by the client."
                    deviceType:
                      type: "string"
                      description: "Type of the client's device (e.g., Mobile, Desktop)."
            steps:
              type: "object"
              description: "Mapping of steps in the KYC process."
              additionalProperties:
                type: "object"
                description: "Details of a specific step."
            terminationState:
              type: "string"
              description: "Termination state of the session."
              nullable: true
            terminationNotes:
              type: "string"
              description: "Notes about the termination state."
              nullable: true
            startedAt:
              type: "string"
              format: "date-time"
              description: "Timestamp of when the KYC process started."
            completedAt:
              type: "string"
              format: "date-time"
              description: "Timestamp of when the KYC process completed."
              nullable: true
            expiresAt:
              type: "string"
              format: "date-time"
              description: "Timestamp of when the session expires."
              nullable: true
            duration:
              type: "number"
              format: "float"
              description: "Duration of the KYC process in seconds."
              nullable: true
            completed:
              type: "boolean"
              description: "Whether the KYC process is completed."
            decision:
              type: "object"
              description: "Decision details for the KYC."
              properties:
                status:
                  type: "string"
                  description: "Status of the decision (e.g., Approved, Rejected)."
                notes:
                  type: "array"
                  description: "Additional notes regarding the decision."
                  items:
                    type: "string"
                timestamp:
                  type: "string"
                  format: "date-time"
                  description: "Timestamp of when the decision was made."
            cloned:
              type: "boolean"
              description: "Indicates whether the session was cloned."
              nullable: true
            previousSessionId:
              type: "string"
              description: "ID of the previous session, if any."
              nullable: true

  responses:
    Unauthorized:
      description: >
        The bearer token is missing, invalid or expired, or the API key lacks the role this endpoint requires.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
          examples:
            accessDenied:
              summary: Missing, invalid or expired token
              value:
                success: false
                data: null
                errors:
                  - code: 401
                    data: null
                    message: Access Denied
                publicError:
                  statusCode: 401
                  errorCode: 0
                  message: Access Denied
                  data: null
            missingRole:
              summary: The API key lacks the required role
              value:
                success: false
                data: null
                errors:
                  - code: 401
                    data: null
                    message: Unauthorized Access - Missing role
                publicError:
                  statusCode: 401
                  errorCode: 0
                  message: Unauthorized Access - Missing role
                  data: null
    TooManyRequests:
      description: The rate limit was exceeded. Retry later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
          example:
            success: false
            data: null
            errors:
              - code: 429
                data: null
                message: Limit exceeded
            publicError:
              statusCode: 429
              errorCode: 0
              message: Limit exceeded
              data: null
    ServiceUnavailable:
      description: Authentication could not be checked at the moment. Retry later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
          example:
            success: false
            data: null
            errors:
              - code: 503
                data: null
                message: Service temporarily unavailable
            publicError:
              statusCode: 503
              errorCode: 0
              message: Service temporarily unavailable
              data: null

tags:
  - name: authentication
    description: Obtain an access token.
  - name: aml
    description: AML screening searches and monitoring.
  - name: cfm
    description: Start and continue CFM (Customer Flow Manager) verification journeys.
  - name: case
    description: Cases, their entities, statuses and documents.

paths:
  /v1/public/login:
    post:
      tags:
        - authentication
      summary: login
      description: |
        You should have already generated an access key pair via QGen Online Dev tools section.
        If not, Login to QGen Online using your admin user credentials, and access the Dev tools 
        to generate an API key. You can generate multiple keys for both
        the development or production environments. Multiple keys are uniquely
        identified by a unique key identifier called ClientID.
        This 'Login' endpoint converts your clientID/secretkey pair, if validated, into
        a JWT session token to use during your other API calls. You can call this more than one 
        time during a session to make sure it does not expire. So check the expiry time 
        provided with the token in the response and make sure to generate a new token before the time is up.
        Parameters required:
        - `clientId` — the 24-character key identifier shown when the API key was generated
        - `clientSecret` — the secret key

        Wrong credentials, a revoked key, or a request from an IP address the key is not allowed to be used from
        all answer **HTTP 401** with the message `unable to login`.
      security: []
      requestBody:
        description: Send the clientID and respective secret API key as generated in QGenOnline
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId:
                  type: string
                  description: ClientID that matches the secret key — a 24-character hexadecimal id.
                clientSecret:
                  type: string
                  description: Secret key
              required:
                - clientId
                - clientSecret

              example:
                clientId: 66f1b5b3e6b1f2c8a4d7e8a1
                clientSecret: client_secret
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: True if the token was generated successfully. False otherwise
                  data:
                    type: object
                    description: In case of an error, this object will be set to 'null'
                    properties:
                      accessToken:
                        type: string
                        description: The temporary JWT token to use in all subsequent calls
                      expires:
                        type: string
                        format: date-time
                        description: expiry date and time of the token
                  errors:
                    type: array
                    nullable: true
                    description: Array of error object types. If the request was successful, this object will be set to 'null'
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          description: The HTML error reason code. Includes 400 (bad request), 401 (Unauthorized)
                        message:
                          type: string
                          description: A descriptive message describing the reason for the error
              example:
                success: true
                data:
                  accessToken: |
                    eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9.eyJjbGFpbXMiOlsiQ29tcGx5IiwiQU1MIl0sImNsaWVudF9pZCI6IjYzZjM4NWI2OTQwY2JmYzYx
                    ZjYxM2Q1NCIsImV4cCI6MTY3NjkxNDg2NywiaXNzIjoiUWdlbkFwaSIsIm1lcmNoYW50X2lkIjoiNWVkZTE3OTUxMTExZmMyNGQ4OWJiYTdiIiwibW
                    VyY2hhbnRfbmFtZSI6Iktub3cgTWUgTm93Iiwib3JpZ19pYXQiOjE2NzY5MDc2NjcsInVzZXJuYW1lIjoiZ29kd2luLnNjaGVt
                    YnJpQGtub3dtZW5vdy5jb20ifQ.ozzW9BCFPicR93t_zOJTwn3vaHc8-ibiQbYqZVlPi7AoUw9skC0QL6dgxkVqQGxQ2on8arR_NiaaIR8JxelcGS
                  expires: 2023-02-20T17:41:07.725270578Z
                errors: null

        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              examples:
                invalidClientId:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 400
                        message: "clientId - Value must be a valid bson object ID"
                malformedBody:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 400
                        message: "invalid character '\\n' in string literal"

        "401":
          description: >
            The credentials were not accepted — wrong client id or secret, a revoked key, or an IP address the key
            may not be used from. The body carries code 500 even though the HTTP status is 401.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                success: false
                data: null
                errors:
                  - code: 500
                    message: "unable to login"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/aml/search:
    post:
      tags:
        - aml
      summary: Search
      description: |
        Creates a new search by sending search terms, parameters and filters. This endpoint can be used to 
        instantly know if the entity has any potential hits. If there are no hits, the endpoint returns 'No Match' 
        and a 0 value in the totalHits. This allows you to instantly onboard a customer. If this search
        return 'potential match' plus a value which is higher than 1 in the totalHits field, you can suspend the 
        onboarding process until you review the hits on qgenonline.com using the returned ID to filter 
        the results. To enable monitoring isMonitored boolean flag should be set explicitly.
        Supply `caseId` and `entityId` together to link the search to an entity on a case in the same call, which
        makes it reviewable on the case. The case and entity are checked before the search runs. If the search
        succeeds but linking it fails, the call answers **500** without returning the search `id`.

        `searchTerm`, `clientRef` and `filters` are required.

        Requires the **aml:operator** role (and **case:operator** as well when linking to a case).
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - searchTerm
                - clientRef
                - filters
              properties:
                searchTerm:
                  type: string
                  maxLength: 255
                  description: The name of the entity. Can be a person or a company
                filters:
                  type: object
                  description: Required. Send `{}` to search without filters.
                  properties:
                    entityType:
                      type: string
                      enum: [person, company, organisation, vessel, aircraft]
                      description: The type of entity to search for. Optional.
                    birthYear:
                      type: string
                      description: >
                        The year of birth of the person if known, as a 4-digit string between 1900 and the current
                        year. Leave empty if the entity is a company.
                    countryCodes:
                      description: |
                        Results are filtered by the entity nationality or 
                        country of residence. An array of ISO 3166-1 alpha-2 strings
                      type: array
                      items:
                        type: string
                    types:
                      description: |
                        These types are used within the search to refine 
                        the result set. There is an extensive range of 
                        filters available - use of the filters is entirely 
                        optional. The example shows how the filters should 
                        be included in your request. You must send a value
                        from the allowed list as documented here.
                      type: array
                      items:
                        type: string
                        enum:
                          - sanction
                          - warning
                          - fitness-probity
                          - pep
                          - pep-class-1
                          - pep-class-2
                          - pep-class-3
                          - pep-class-4
                          - adverse-media
                          - adverse-media-financial-crime
                          - adverse-media-violent-crime
                          - adverse-media-sexual-crime
                          - adverse-media-terrorism
                          - adverse-media-fraud
                          - adverse-media-narcotics
                          - adverse-media-general
                          - adverse-media-v2-property
                          - adverse-media-v2-financial-aml-cft
                          - adverse-media-v2-fraud-linked
                          - adverse-media-v2-narcotics-aml-cft
                          - adverse-media-v2-violence-aml-cft
                          - adverse-media-v2-terrorism
                          - adverse-media-v2-cybercrime
                          - adverse-media-v2-general-aml-cft
                          - adverse-media-v2-regulatory
                          - adverse-media-v2-financial-difficulty
                          - adverse-media-v2-violence-non-aml-cft
                          - adverse-media-v2-other-financial
                          - adverse-media-v2-other-serious
                          - adverse-media-v2-other-minor
                clientRef:
                  type: string
                  description: Your reference for easy link to your records
                  maxLength: 255
                notes:
                  type: string
                  description: |
                    Your own notes to add to this search for future reference. Max length is 1024 characters.
                fuzziness:
                  description: |
                    Determines how closely the returned results must match
                    the supplied name, from 0.0 to 1.0. Rounded to one decimal place.
                  type: number
                  format: float
                  minimum: 0.0
                  maximum: 1.0
                tags:
                  description: |
                    Up to three custom tags. The first value is assigned to Tag 1, the second to Tag 2 and the
                    third to Tag 3. Any or all tags can be left empty.
                  type: array
                  items:
                    type: string
                isMonitored:
                  type: boolean
                  description: >
                    Flag to enable monitoring of the search. Defaults to `false`, so a search is not monitored
                    unless you ask for it.
                caseId:
                  type: string
                  description: >
                    Optional. Supply together with `entityId` to link the resulting search to an entity on a case,
                    exactly as `POST /v1/case/cases/{caseid}/{entityid}/{complyid}/link` would. Must be a valid
                    ObjectId, and the case must contain the entity. Supplying one of the pair without the other is
                    rejected.
                entityId:
                  type: string
                  description: >
                    Optional. The Person or Company on the case to link the search to. Requires `caseId`. Because
                    linking writes to the case module, this variant additionally requires the **case:operator**
                    role on top of **aml:operator**, and is refused without it before the (billable) search runs.

              example:
                searchTerm: Jesse Pinkman
                filters:
                  entityType: person
                  birthYear: "1980"
                  countryCodes:
                    - US
                    - CA
                  types:
                    - sanction
                    - warning
                    - fitness-probity
                    - pep
                    - pep-class-1
                    - pep-class-2
                    - pep-class-3
                    - pep-class-4
                    - adverse-media
                    - adverse-media-financial-crime
                    - adverse-media-violent-crime
                    - adverse-media-sexual-crime
                    - adverse-media-terrorism
                    - adverse-media-fraud
                    - adverse-media-narcotics
                    - adverse-media-general
                clientRef: "1234567890"
                notes: This is an optional note for your records.
                fuzziness: 0.6
                tags:
                  - String to assign to Tag 1
                  - String to assign to Tag 2
                  - String to assign to Tag 3
                isMonitored: false

      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: True if the token was generated successfully. False otherwise
                  data:
                    type: object
                    description: In case of an error, this object will be set to 'null'
                    properties:
                      id:
                        type: string
                        description: >
                          The search id. Use it with `POST /v1/aml/search/{id}`, `DELETE /v1/aml/search/{id}`,
                          `POST /v1/aml/search/monitor` and the case link endpoints.
                      totalHits:
                        type: integer
                        description: total number of hits
                      matchStatus:
                        type: string
                        enum:
                          - no_match
                          - false_positive
                          - potential_match
                          - true_positive
                          - unknown
                          - true_positive_approve
                          - true_positive_reject
                        description: >
                          The search's match status. A new search is `potential_match` when it has hits and
                          `no_match` when it has none.
                  errors:
                    type: array
                    nullable: true
                    description: Array of error object types. If the request was successful, this object will be set to 'null'
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          description: The HTML error reason code. Includes 400 (bad request), 401 (Unauthorized)
                        message:
                          type: string
                          description: A descriptive message describing the reason for the error
              example:
                success: true
                data:
                  id: unique_id
                  totalHits: 9
                  matchStatus: potential_match
                errors: null

        "400":
          description: >
            Validation failed, or (when linking) the case does not exist or does not contain the entity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              examples:
                missingClientRef:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 400
                        message: clientRef - Value must not be empty
                missingFilters:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 400
                        message: filters - Value must not be nil
                entityNotInCase:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 400
                        message: entity not found in case

        "401":
          description: >
            The token is missing or invalid, the API key lacks **aml:operator**, or the search links to a case and
            the key lacks **case:operator**.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              examples:
                missingRole:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 401
                        message: Unauthorized Access - Missing role
                linkRoleMissing:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 401
                        message: case:operator role required to link an AML search to a case entity
        "500":
          description: >
            The search could not be performed or has not completed, or it succeeded but could not be linked to the
            case entity (no search `id` is returned in that case).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                success: false
                data: null
                errors:
                  - code: 500
                    message: failed to link aml search to entity, but search was successful
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/aml/search/{id}:
    post:
      tags:
        - aml
      summary: Get Search by ID
      description: |
        Retrieves details of a previously performed search using its unique ID. This endpoint allows you to 
        access search results that were previously created through the search endpoint. You can use this 
        endpoint to review potential matches that were identified during the initial search process.

        Requires the **aml:viewer** role.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The unique search ID that was previously generated when the search was created
          example: unique_id
      responses:
        "200":
          description: |
            Successful response containing the stored search, its result and the live AML assessment.
            The search must have completed; a search still `Pending` (for example because the
            ComplyAdvantage call failed) returns an error rather than a partial payload.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      search:
                        type: object
                        description: The stored search, as submitted and as it stands now.
                        properties:
                          id:
                            type: string
                            description: The search ID. The same value you passed in the path.
                          searchTerm:
                            type: string
                          fuzziness:
                            type: number
                            format: float
                          entityType:
                            type: string
                          birthYear:
                            type: string
                          countryCodes:
                            type: array
                            items:
                              type: string
                          types:
                            type: array
                            description: The ComplyAdvantage list types the search was run against.
                            items:
                              type: string
                          totalHits:
                            type: integer
                            description: >
                              The hit count ComplyAdvantage reported when the search ran. It is a snapshot and does
                              not move as hits are whitelisted or removed afterwards — use `liveTotalHits` for the
                              current count.
                          matchTypeHits:
                            type: array
                            items:
                              type: string
                          tags:
                            type: array
                            items:
                              type: string
                          clientReference:
                            type: string
                            nullable: true
                          isMonitored:
                            type: boolean
                          hasUpdate:
                            type: boolean
                            description: True when a monitored search has updates that have not been reviewed.
                          status:
                            type: string
                            description: >
                              The raw stored status. Prefer `amlStatus`, which normalises legacy spellings onto the
                              defined set.
                          internalStatus:
                            type: string
                            description: Processing state of the search, e.g. `Completed` or `Pending`.
                          complyId:
                            type: integer
                          searchResultId:
                            type: string
                            nullable: true
                            description: >
                              The id of the stored result — the value to pass as `searchId` to
                              `POST /v1/aml/search/hits/paginate`. Same as `result.id`.
                          batchId:
                            type: string
                            nullable: true
                          countries:
                            type: string
                          exactMatch:
                            type: boolean
                          monitoredModifiedBy:
                            type: object
                            nullable: true
                            description: Who last changed monitoring (same shape as `createdBy`).
                          monitorUpdateSource:
                            type: string
                          apiKeyRefId:
                            type: string
                          refreshedBy:
                            type: object
                            nullable: true
                            description: Who last refreshed the search (same shape as `createdBy`).
                          statusModifiedBy:
                            type: object
                            nullable: true
                            description: Who last changed the status (same shape as `createdBy`).
                          correlationId:
                            type: string
                          source:
                            type: string
                          revisionID:
                            type: integer
                          createdBy:
                            $ref: "#/components/schemas/Actor"
                          modifiedBy:
                            type: object
                            nullable: true
                            description: Same shape as `createdBy`; null until the record is modified.
                          deletedBy:
                            type: object
                            nullable: true
                            description: Same shape as `createdBy`; null unless the record was deleted.
                      result:
                        type: object
                        description: >
                          The stored ComplyAdvantage result for the search. `complyResult` is the provider payload
                          passed through unchanged; individual hits are not included here — page them with
                          `POST /v1/aml/search/hits/paginate`.
                        properties:
                          id:
                            type: string
                            description: The result id — the value to pass as `searchId` to `POST /v1/aml/search/hits/paginate`.
                          complySearchId:
                            type: string
                          batchId:
                            type: string
                            nullable: true
                          merchantId:
                            type: string
                          correlationId:
                            type: string
                          complyAdvantageId:
                            type: integer
                          revisionID:
                            type: integer
                          createdBy:
                            $ref: "#/components/schemas/Actor"
                          modifiedBy:
                            type: object
                            nullable: true
                            description: Same shape as `createdBy`; null until the record is modified.
                          deletedBy:
                            type: object
                            nullable: true
                            description: Same shape as `createdBy`; null unless the record was deleted.
                          complyResult:
                            type: object
                            additionalProperties: true
                      updates:
                        type: object
                        description: Monitoring updates recorded against the search since it was last reviewed.
                        properties:
                          added:
                            type: array
                            nullable: true
                            description: Null when nothing was added.
                            items:
                              type: string
                          updated:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                name:
                                  type: string
                          deleted:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                name:
                                  type: string
                      amlStatus:
                        type: string
                        enum: [Not set, All clear, Possible hit, Positive hit]
                        description: >
                          The compliance verdict recorded on this search, returned as stored and normalised onto this
                          set. It is never derived from the hits: `Not set` means no operator has adjudicated the
                          search, whatever `hitStats` reports, so treat it as the decision itself rather than as a
                          summary of what was found.
                      categories:
                        type: array
                        description: >
                          Per searchable ComplyAdvantage group, how many of its list types the search covered. A group
                          that was not searched is still returned, with `covered` set to 0.
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                              enum: [sanctions, peps, adverse-media-v2]
                              description: Stable group key. Match on this rather than on `label`.
                            label:
                              type: string
                              description: The ComplyAdvantage catalogue name for the group. Display text may change.
                            covered:
                              type: integer
                            total:
                              type: integer
                      liveTotalHits:
                        type: integer
                        description: >
                          The current number of hits stored for the search. Omitted when the live count could not be
                          read; it is deliberately not filled in from `search.totalHits`, which is a snapshot.
                      hitStats:
                        type: object
                        description: >
                          The live breakdown of the search's hits — what was found, which is a separate question from
                          `amlStatus`, the decision taken about it. Omitted when unavailable.
                        properties:
                          totalHits:
                            type: integer
                          nonWhitelistedCount:
                            type: integer
                            description: Hits that have not been whitelisted.
                          exactNonWhitelistedCount:
                            type: integer
                            description: Outstanding hits that are exact matches.
                  errors:
                    type: array
                    nullable: true
                    items:
                      type: object
              example:
                success: true
                data:
                  search:
                    id: unique_id
                    searchTerm: Jesse Pinkman
                    fuzziness: 0.6
                    entityType: person
                    birthYear: "1980"
                    countryCodes: [US, CA]
                    types: [sanction, warning, fitness-probity, pep]
                    totalHits: 9
                    isMonitored: false
                    hasUpdate: false
                    status: Not set
                    internalStatus: Completed
                  result:
                    id: unique_id
                    complySearchId: unique_id
                    complyAdvantageId: 1234567890
                    complyResult: {}
                  updates:
                    added: null
                    updated: []
                    deleted: []
                  amlStatus: Possible hit
                  categories:
                    - key: sanctions
                      label: Sanctions, Warnings and Fitness And Probity
                      covered: 3
                      total: 3
                    - key: peps
                      label: PEPs
                      covered: 1
                      total: 5
                    - key: adverse-media-v2
                      label: All Adverse Media V2
                      covered: 0
                      total: 14
                  liveTotalHits: 9
                  hitStats:
                    totalHits: 9
                    nonWhitelistedCount: 4
                    exactNonWhitelistedCount: 0
                errors: null

        "400":
          description: The id is not a valid id, or no search of your account has this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                success: false
                data: null
                errors:
                  - code: 400
                    message: id - Value must be a valid bson object ID
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: The search could not be loaded, for example because it has not completed yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                success: false
                data: null
                errors:
                  - code: 500
                    message: unable to get AML search by ID
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags:
        - aml
      summary: Delete a Search
      description: |
        Deletes a previously performed search using its unique ID.

        Requires the **aml:admin** role.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The unique search ID that was previously generated when the search was created.
          example: unique_id
      responses:
        "200":
          description: Search successfully deleted. `data` is null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                success: true
                data: null
                errors: null
        "400":
          description: >
            The id is not valid, no search of your account has this id, or the search cannot be deleted (for
            example because it was already deleted).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              examples:
                notFound:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 1011
                        message: "unable to delete AML search"
                invalidId:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 400
                        message: "id - Value must be a valid bson object ID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/aml/search/hits/paginate:
    post:
      tags:
        - aml
      summary: Paginate AML Hits
      description: |
        Retrieves paginated hits for a specific search. This endpoint allows you to 
        fetch hits in smaller chunks, enabling more efficient data retrieval and display.
        You can specify which page of results to retrieve and how many results per page.

        **`searchId` is the id of the search's stored result, not the search id.** Take it from
        `POST /v1/aml/search/{id}` — `data.result.id` (also returned as `data.search.searchResultId`). The `id`
        returned by `POST /v1/aml/search` does not work here.

        Requires the **aml:viewer** role.
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                searchId:
                  type: string
                  description: >
                    The id of the search's stored result — `data.result.id` (or `data.search.searchResultId`)
                    from `POST /v1/aml/search/{id}`. This is not the search `id` returned by `POST /v1/aml/search`.
                page:
                  type: integer
                  minimum: 0
                  description: The page number to retrieve (zero-based). Defaults to 0 when omitted.
                perPage:
                  type: integer
                  minimum: 1
                  description: The number of hits per page. Must be greater than 0.
              required:
                - searchId
                - perPage
              example:
                searchId: 60f1b5b3e6b1f2c8a4d7e8f9
                page: 0
                perPage: 10
      responses:
        "200":
          description: |
            Successful response containing the paginated hits for the requested search.
            Returns a list of hits based on the specified page and perPage parameters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: True if the hits were retrieved successfully. False otherwise
                  data:
                    type: object
                    properties:
                      hits:
                        type: array
                        description: >
                          The requested page of hits. Each entry is the ComplyAdvantage hit payload passed through
                          unchanged, plus `detectionDate` when the hit was picked up by monitoring rather than by
                          the original search.
                        items:
                          type: object
                          additionalProperties: true
                  errors:
                    type: array
                    nullable: true
                    description: Will be null when the request is successful
                    items:
                      type: object

        "400":
          description: >
            `searchId` is not a valid id, `perPage` is missing or 0, or no stored result of your account has this
            id (for example because the search `id` was sent instead of the result id).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              examples:
                invalidId:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 400
                        message: searchId - Value must be non empty a valid bson object ID
                notFoundOrInvalidPaging:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 500
                        message: unable to paginate AML hits

        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/cfm/session/continue:
    post:
      tags:
        - cfm
      summary: Continue a session
      description: |
        Replaces an **expired** session with a new one, so the end user can carry on where they left off (or
        start, if they never opened the link). The new session and journey are returned — `sessionId` and
        `journeyId` in the response are the new ones, not the ones you sent.

        A new session is created only when the previous one has expired without being completed. Otherwise the
        request is refused with **400**, when the session:
        - was terminated by an operator;
        - has already been continued (cloned) — the end user should use the link already sent;
        - is already completed;
        - is in progress and has not expired yet;
        - was never opened and has not expired yet.

        Only sessions of a **person** entity can be continued.

        Depending on the `withMessage` parameter:

        - If `withMessage` is set to `true`, the system creates a new session and sends the session link to the end user via email or SMS (email has priority if both are available). The end user uses the link to resume their session.
        - If `withMessage` is set to `false` (the default), the system creates a new session but does not send any notifications. You can use the response to embed the session link directly.

        The new session is billed; when your account cannot be charged the request is refused with **409**.

        Requires the **cfm:operator** and **case:viewer** roles.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: string
                  description: The unique session ID.
                withMessage:
                  type: boolean
                  default: false
                  description: |
                    Determines whether a notification should be sent to the end user. 
                    - `true`: Sends email or SMS with the session link.
                    - `false`: Does not send notifications.
              required:
                - sessionId
              example:
                sessionId: "unique-session-id"
                withMessage: false
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates whether the operation was successful.
                  data:
                    type: object
                    description: The details of the session and its status.
                    properties:
                      caseId:
                        type: string
                        description: The unique case ID associated with the session.
                      entityId:
                        type: string
                        description: The unique entity ID.
                      journeyId:
                        type: string
                        description: The id of the new journey.
                      sessionId:
                        type: string
                        description: The id of the new session.
                      withMessage:
                        type: boolean
                        description: Indicates whether a message was sent to the end user.
                      cfmUrl:
                        type: string
                        nullable: true
                        description: The URL for the session, provided when `withMessage` is `false`.
                      messageType:
                        type: string
                        nullable: true
                        enum: [Email, Sms, null]
                        description: The type of message sent, provided when `withMessage` is `true`.
                      message:
                        type: string
                        nullable: true
                        description: A detailed message about the session status or action taken.
                  errors:
                    type: array
                    nullable: true
                    description: Contains error details if the operation failed.
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          description: The HTTP status code.
                        message:
                          type: string
                          description: A description of the error.
              examples:
                withMessageTrue:
                  summary: Response when withMessage is true
                  value:
                    success: true
                    data:
                      caseId: "uniqueId"
                      entityId: "uniqueId"
                      journeyId: "uniqueId"
                      sessionId: "uniqueId"
                      withMessage: true
                      cfmUrl: null
                      messageType: "Email"
                      message: "The previous session has been expired but is not completed. New link has been sent via email. End user should check their inbox to continue the session where they left."
                    errors: null
                withMessageFalse:
                  summary: Response when withMessage is false
                  value:
                    success: true
                    data:
                      caseId: "uniqueId"
                      entityId: "uniqueId"
                      journeyId: "uniqueId"
                      sessionId: "uniqueId"
                      withMessage: false
                      cfmUrl: "http://localhost:8082/cfm/?session_id=6728ce0872d7b6937043e5a6"
                      messageType: null
                      message: null
                    errors: null
        "400":
          description: The session cannot be continued, or the request is not valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              examples:
                inProgress:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 400
                        message: "this session is in progress at the moment. The session expires at 2026-10-13 15:04:05. Please wait the session to be expired before to request new one"
                completed:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 400
                        message: "this session is already completed successfully"
                terminated:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 400
                        message: "this session was terminated by an operator and cannot be continued"
                alreadyCloned:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 400
                        message: "this session is expired and cloned already. End user should check their email or sms inbox for the new link"
                notExpired:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 400
                        message: "this session is not used and expired yet"
        "401":
          description: >
            The token is missing or invalid, the API key lacks a required role, or the session belongs to another
            account (`unauthorised access`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              examples:
                missingRole:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 401
                        message: Unauthorized Access - Missing role
                otherAccount:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 401
                        message: unauthorised access
        "409":
          description: Billing refused the new session — your account cannot be charged for it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: >
            The session could not be continued — for example it belongs to a company entity, which cannot be
            continued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                success: false
                data: null
                errors:
                  - code: 500
                    message: unable to find the person entity within the case entities
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/aml/search/monitor:
    post:
      tags:
        - aml
      summary: Monitor
      description: |
        Switch 'ON' or 'OFF' the monitoring on a specific search. Searches are not
        monitored unless asked for, either by setting `isMonitored` on the search
        request or by calling this endpoint afterwards.

        `isMonitored` is optional but defaults to `false`: a request that omits it **switches monitoring off**.

        Requires the **aml:operator** role.
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  description: The search ID returned in the ID field of the response to a Search call
                isMonitored:
                  type: boolean
                  default: false
                  description: >
                    Set to 'true' if you want to monitor this search. Set to 'false' — or leave it out — to stop
                    monitoring.
              example:
                id: unique_id
                isMonitored: false

      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: true if successful, false if unsuccessful
                  data:
                    type: object
                    nullable: true
                    description: Always null; the call returns no payload.
                  errors:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
              example:
                success: true
                data: null
                errors: null

        "400":
          description: Invalid ID - ID does not exist
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: true if successful, false if unsuccessful
                  data:
                    type: object
                    nullable: true
                    description: Always null; the call returns no payload.
                  errors:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
              examples:
                invalidIdExample:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 400
                        message: id - Value must be a valid bson object ID
                notFoundExample:
                  summary: The search does not exist. Reported as a 400 with error code 1011, not a 404.
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 1011
                        message: unable to set monitor

        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/cfm/case/init:
    post:
      tags:
        - cfm
      summary: Initiate a new case via the CFM.
      description: |
        Designed to initiate a customer onboarding session via our CFM component. Make the call from your onboarding webpage after collecting basic personal details
        from an applicant. To make the call you will need to first get a valid caseTypeId which you can retrieve via the `/v1/cfm/case/types` endpoint. You may
        ask our applicant to select a product or service linked to the case type created in QGoL or assume it automatically based on the link the applicant used.
        A successful request will create a new Case Summary containing the Personal Entity with the personal details you submitted. We will return the `CaseId`, the `entityId`
        and especially a URL link where the session with the requested CFM flow is hosted.

        Person entities remain the default: existing integrations that omit `entityType` continue to work unchanged. To onboard a Company instead, set
        `entityType: "company"` and provide a `company` block (only `company.name` is required; all other company fields are optional).
        The response echoes `entityType` so you can tell which kind of entity a session belongs to.

        **Supply exactly one of `caseTypeId` or `riskLevelId`.** With `caseTypeId`, the session runs the risk level
        linked to that case type for the entity type. With `riskLevelId`, that risk level is used directly. Sending
        both, or neither, is rejected with 400.

        `referenceId` is always required and must not have been used before. At least one of `email` or `mobile`
        must be supplied — when `email` is omitted, `mobile` is mandatory.

        For a Person, `firstName` and `lastName` are required unless the risk level's journey reads the entity
        details from an identity document (Override Entity Details), in which case they may be empty. Together
        they must not exceed 255 characters, since they form the AML search term. For a Company, `company.name` is
        required instead.

        `legalName`, `countryCode`, `placeOfBirth` and `countryOfBirth` are accepted for compatibility but are
        currently not stored.

        The session is billed; when your account cannot be charged the request is refused with **409**.

        Requires the **cfm:operator** and **case:operator** roles.
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                entityType:
                  type: string
                  enum: [person, company]
                  description: Kind of entity the session is opened against. Defaults to `person` when omitted.
                  example: "person"
                company:
                  type: object
                  description: Company details. Required when `entityType` is `company`. Only `name` is required; other fields are optional.
                  properties:
                    name:
                      type: string
                      description: Registered legal name of the company. Required when `entityType` is `company`.
                      example: "Acme Widgets Ltd"
                    tradeName:
                      type: string
                      description: Trading name if different from the registered name.
                    regNum:
                      type: string
                      description: Company registration number.
                    regDate:
                      type: string
                      format: date
                      description: Company registration date in `YYYY-MM-DD` format.
                    regCountry:
                      type: string
                      description: Country of registration, ISO 3166-1 alpha-2.
                    businessType:
                      type: string
                      description: Free-text business type / industry.
                    companyType:
                      type: string
                      description: Legal company type (e.g. Ltd, LLC).
                    vatNum:
                      type: string
                      description: VAT registration number.
                    repName:
                      type: string
                      description: Company representative's name.
                    repEmailAddress:
                      type: string
                      format: email
                      description: Company representative's email.
                    repPhoneNum:
                      type: string
                      description: Company representative's phone number.
                    compEmailAddress:
                      type: string
                      format: email
                      description: Company contact email.
                    compPhoneNum:
                      type: string
                      description: Company contact phone number.
                    compStatus:
                      type: string
                      description: Company operational status.
                caseTypeId:
                  type: string
                  description: >
                    A valid value as returned from the `/v1/cfm/case/types` endpoint. Case Types are created in QGen
                    Online via the UI. Supply either this or `riskLevelId`, not both. Hidden case types are rejected.
                  example: "unique_id"
                riskLevelId:
                  type: string
                  description: >
                    The risk level to run the session against — see `GET /v1/cfm/risk-levels`. Supply either this or
                    `caseTypeId`, not both.
                  example: "unique_id"
                referenceId:
                  type: string
                  description: A unique reference to your applicant. Make sure this was never submitted before and does not already exist in QGoL.
                  example: "testreference3"
                description:
                  type: string
                  description: Free text you can submit with the application. Will be visible in the notes field in the Case Summary.
                  example: "This is the description field"
                email:
                  type: string
                  format: email
                  description: Applicant email. We validate this and can reject a request if this is not a valid email structure. At least one of email or mobile is required.
                  example: "bobsmith@example.com"
                mobile:
                  type: string
                  description: Applicant mobile number with country code. The format is not validated.
                  example: "+35679000000"
                title:
                  type: string
                  enum: [Mr, Mrs, Miss, Ms, Dr, Prof, Mx]
                  description: The title before an applicant's name, limited to the specified prefixes.
                  example: "Mr"
                firstName:
                  type: string
                  description: Applicant's first name. Required for a Person unless the journey reads it from an identity document.
                  example: "Abraham"
                lastName:
                  type: string
                  description: Applicant's last name. Required for a Person unless the journey reads it from an identity document.
                  example: "Murray"
                legalName:
                  type: string
                  description: Accepted but currently not stored.
                  example: "Abraham Murray"
                countryCode:
                  type: string
                  description: Accepted but currently not stored.
                  example: "MT"
                locale:
                  type: string
                  description: Language preference of the applicant. Defaults to English if unspecified or unsupported.
                  example: "en"
                gender:
                  type: string
                  enum: [Male, Female, Non-Binary, Prefer not to say]
                  description: Gender of the applicant.
                  example: "Male"
                dateOfBirth:
                  type: string
                  format: date
                  description: >
                    Date of birth of applicant in YYYY-MM-DD format. The year must be between 1900 and the current year,
                    and the date must not be in the future.
                  example: "1975-06-12"
                placeOfBirth:
                  type: string
                  description: Accepted but currently not stored.
                  example: "London"
                countryOfBirth:
                  type: string
                  description: Accepted but currently not stored.
                  example: "GB"
                addressLine1:
                  type: string
                  description: Primary address line for the applicant.
                  example: "House Name"
                addressLine2:
                  type: string
                  description: Secondary address line for the applicant.
                  example: "New Road"
                postCode:
                  type: string
                  description: Postal code for the applicant's address.
                  example: "SLM1024"
                country:
                  type: string
                  description: Country of the applicant, using ISO 3166-1 alpha-2 format.
                  example: "MT"
                nationality:
                  type: string
                  description: The nationality of the applicant as an adjective, e.g. `Maltese`.
                  example: "Maltese"
                customFields:
                  type: object
                  description: >
                    Optional custom field values, split by the record they belong to (`case` and `person` only). Keys
                    must match the custom field sets configured for the case type; unknown keys are ignored.
                  properties:
                    case:
                      type: object
                      additionalProperties: true
                    person:
                      type: object
                      additionalProperties: true
              required:
                - referenceId

            examples:
              InitCaseExample:
                summary: Example request to initiate a new case (Person)
                value:
                  caseTypeId: "unique_id"
                  referenceId: "UniqueReferenceABCD01"
                  description: "This is the description field"
                  email: "test@arritech.com"
                  mobile: "+35679000000"
                  title: "Mr"
                  firstName: "Abraham"
                  lastName: "Murray"
                  legalName: ""
                  countryCode: "MT"
                  locale: "en"
                  gender: "Male"
                  dateOfBirth: "1986-12-12"
                  placeOfBirth: ""
                  countryOfBirth: "MT"
                  addressLine1: ""
                  addressLine2: ""
                  postCode: ""
                  country: "MT"
                  nationality: "Maltese"
              InitCaseCompanyExample:
                summary: Example request to initiate a new case (Company)
                value:
                  caseTypeId: "unique_id"
                  referenceId: "UniqueReferenceCompany01"
                  description: "Company onboarding"
                  entityType: "company"
                  email: "billing@acmewidgets.example"
                  company:
                    name: "Acme Widgets Ltd"
                    tradeName: "Acme"
                    regNum: "12345678"
                    regDate: "2015-03-14"
                    regCountry: "MT"
                    businessType: "Retail"
                    companyType: "Ltd"
                    vatNum: "MT12345678"
                    repName: "Abraham Murray"
                    repEmailAddress: "abraham@acmewidgets.example"
                    repPhoneNum: "+35679000000"
                    compEmailAddress: "hello@acmewidgets.example"
                    compPhoneNum: "+35621000000"
                    compStatus: "Active"

      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: True if the token was generated successfully. False otherwise
                  data:
                    type: object
                    description: In case of an error, this object will be set to 'null'
                    properties:
                      caseId:
                        type: string
                        description: The ID of the case the session was created against.
                      entityId:
                        type: string
                        description: The ID of the entity the session was created against.
                      entityType:
                        type: string
                        enum: [person, company]
                        description: Kind of entity the session was opened against. Echoes the request's `entityType` (defaults to `person`).
                      journeyId:
                        type: string
                        description: The ID of the journey the session runs.
                      sessionId:
                        type: string
                        description: the unique session id that makes the CFM url unique. This session expires as per setting in QGoL General settings. Should be returned to the frontend to start cfm process.
                      cfmUrl:
                        type: string
                        description: the URL with the unique session id that makes the CFM url unique.
                  errors:
                    type: array
                    nullable: true
                    description: Array of error object types. If the request was successful, this object will be set to 'null'
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          description: The HTML error reason code. Includes 400 (bad request), 401 (Unauthorized)
                        message:
                          type: string
                          description: A descriptive message describing the reason for the error
              example:
                success: true
                data:
                  caseId: unique_id
                  entityId: unique_id
                  entityType: person
                  journeyId: unique_id
                  sessionId: unique_id
                  cfmUrl: https://qgenonlinedev.com/cfm/?session_id=unique_id
                errors: null
        "400":
          description: >
            Validation failed, `referenceId` was used before, the case type is hidden, or the case type or risk
            level does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              examples:
                caseTypeOrRiskLevel:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 400
                        message: exactly one of caseTypeId or riskLevelId must be supplied
                missingName:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 400
                        message: firstName can not be empty
                malformedBody:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 400
                        message: invalid character '\\n' in string literal
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Billing refused the session — your account cannot be charged for it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/cfm/entity/init:
    post:
      tags:
        - cfm
      summary: Add an entity to an existing case and start its CFM session.
      description: |
        Creates a new entity (a person or a company) on an existing case, starts a CFM session for it and returns
        the link the entity uses to complete the journey. Use it to add, for example, a director to a company case
        created earlier with `POST /v1/cfm/case/init`.

        - `caseId` must be a case of your account.
        - `riskLevelId` decides the journey the entity goes through — list them with `GET /v1/cfm/risk-levels`.
        - Either `email` or `mobile` must be supplied as the entity's contact.
        - For a **person**, `firstName` and `lastName` are required unless the risk level's journey reads the
          entity details from an identity document (Override Entity Details), in which case they may be empty.
        - For a **company**, the `company` block is required and `company.name` must not be empty.

        The session is billed. When your account cannot be charged the request is refused with **409**.

        Requires the **cfm:operator** and **case:operator** roles.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - caseId
                - riskLevelId
              properties:
                caseId:
                  type: string
                  description: The case to add the entity to.
                riskLevelId:
                  type: string
                  description: The risk level whose journey the entity completes.
                entityType:
                  type: string
                  enum: [person, company]
                  default: person
                email:
                  type: string
                  format: email
                  description: Required when `mobile` is empty.
                mobile:
                  type: string
                  description: Required when `email` is empty, e.g. `+35699123456`.
                title:
                  type: string
                  enum: [Mr, Mrs, Miss, Ms, Dr, Prof, Mx]
                firstName:
                  type: string
                  description: Person only. Together with `lastName` at most 255 characters.
                lastName:
                  type: string
                  description: Person only.
                gender:
                  type: string
                  enum: [Male, Female, Non-Binary, Prefer not to say]
                dateOfBirth:
                  type: string
                  format: date
                  description: "`YYYY-MM-DD`. The year must be between 1900 and the current year, and not in the future."
                addressLine1:
                  type: string
                addressLine2:
                  type: string
                postCode:
                  type: string
                country:
                  type: string
                  description: ISO 3166-1 alpha-2 country code, e.g. `MT`.
                nationality:
                  type: string
                  description: Nationality as an adjective, e.g. `Maltese`.
                locale:
                  type: string
                  description: Language of the CFM journey, e.g. `en`.
                customFields:
                  type: object
                  additionalProperties: true
                  description: Values for the entity's custom fields, keyed by field name.
                company:
                  type: object
                  description: Required when `entityType` is `company`.
                  required:
                    - name
                  properties:
                    name:
                      type: string
                    tradeName:
                      type: string
                    regNum:
                      type: string
                      description: Registration number.
                    regDate:
                      type: string
                      format: date
                      description: Registration date, `YYYY-MM-DD`.
                    regCountry:
                      type: string
                    businessType:
                      type: string
                    companyType:
                      type: string
                    vatNum:
                      type: string
                    repName:
                      type: string
                      description: Representative's name.
                    repEmailAddress:
                      type: string
                    repPhoneNum:
                      type: string
                    compEmailAddress:
                      type: string
                    compPhoneNum:
                      type: string
                    compStatus:
                      type: string
            examples:
              person:
                summary: Add a person
                value:
                  caseId: 66f1b5b3e6b1f2c8a4d7e8f9
                  riskLevelId: 66f1b5b3e6b1f2c8a4d7e8fa
                  entityType: person
                  email: jane.doe@example.com
                  firstName: Jane
                  lastName: Doe
                  dateOfBirth: "1985-04-12"
                  country: MT
                  nationality: Maltese
              company:
                summary: Add a company
                value:
                  caseId: 66f1b5b3e6b1f2c8a4d7e8f9
                  riskLevelId: 66f1b5b3e6b1f2c8a4d7e8fb
                  entityType: company
                  email: compliance@acme.example
                  company:
                    name: Acme Ltd
                    regNum: C12345
                    regCountry: MT
      responses:
        "200":
          description: The entity was created and its CFM session started.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          caseId:
                            type: string
                          entityId:
                            type: string
                          entityType:
                            type: string
                            enum: [person, company]
                          journeyId:
                            type: string
                          sessionId:
                            type: string
                          cfmUrl:
                            type: string
                            description: The link the entity opens to complete the journey.
              example:
                success: true
                data:
                  caseId: 66f1b5b3e6b1f2c8a4d7e8f9
                  entityId: 66f1b5b3e6b1f2c8a4d7e900
                  entityType: person
                  journeyId: 66f1b5b3e6b1f2c8a4d7e901
                  sessionId: 66f1b5b3e6b1f2c8a4d7e902
                  cfmUrl: https://qgenonlinedev.com/cfm/?session_id=66f1b5b3e6b1f2c8a4d7e902
                errors: null
        "400":
          description: >
            Validation failed, or the case or risk level does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              examples:
                invalidCase:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 400
                        data: null
                        message: caseId - Value must be non empty a valid bson object ID
                missingName:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 400
                        data: null
                        message: firstName can not be empty
                missingCompany:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 400
                        data: null
                        message: company block is required when entityType is company
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Billing refused the session — your account cannot be charged for it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/cfm/session/init:
    post:
      tags:
        - cfm
      summary: Initialize a session for the CFM API using an existing case.
      description: |
        This endpoint initializes a session for the CFM API using the provided case details and applicant's information. 
        Use it to kickstart an interaction or workflow within the CFM component.

        The entity must belong to the case. The session is billed; when your account cannot be charged the request
        is refused with **409**.

        Requires the **cfm:operator** and **case:viewer** roles.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                caseId:
                  type: string
                  description: The unique ID of the case. Required.
                  example: "unique_id"
                entityId:
                  type: string
                  description: The unique ID of the entity associated with the case. Required.
                  example: "unique_id"
                riskLevelId:
                  type: string
                  description: The risk level ID for the applicant. Required.
                  example: "unique_id"
                locale:
                  type: string
                  description: Language preference for the session. Defaults to English if unspecified.
                  example: "en"
              required:
                - caseId
                - entityId
                - riskLevelId
            examples:
              InitSessionExample:
                summary: Example request to initialize a session
                value:
                  caseId: "unique_id"
                  entityId: "unique_id"
                  riskLevelId: "unique_id"
                  locale: "en"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: True if the token was generated successfully. False otherwise
                  data:
                    type: object
                    description: In case of an error, this object will be set to 'null'
                    properties:
                      caseId:
                        type: string
                        description: The ID of the case the session was created against.
                      entityId:
                        type: string
                        description: The ID of the entity the session was created against.
                      entityType:
                        type: string
                        enum: [person, company]
                        description: Kind of entity the session belongs to. Reflects the entity type set when the case or entity was first initialised.
                      journeyId:
                        type: string
                        description: The ID of the journey the session runs.
                      sessionId:
                        type: string
                        description: the unique session id that makes the CFM url unique. This session expires as per setting in QGoL General settings. Should be returned to the frontend to start cfm process.
                      cfmUrl:
                        type: string
                        description: the URL with the unique session id that makes the CFM url unique.
                  errors:
                    type: array
                    nullable: true
                    description: Array of error object types. If the request was successful, this object will be set to 'null'
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          description: The HTML error reason code. Includes 400 (bad request), 401 (Unauthorized)
                        message:
                          type: string
                          description: A descriptive message describing the reason for the error
              example:
                success: true
                data:
                  caseId: unique_id
                  entityId: unique_id
                  entityType: person
                  journeyId: unique_id
                  sessionId: unique_id
                  cfmUrl: https://qgenonlinedev.com/cfm/?session_id=unique_id
                errors: null
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Always false for bad requests.
                  data:
                    type: object
                    nullable: true
                  errors:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          description: HTTP error code.
                        message:
                          type: string
                          description: A descriptive error message.
              example:
                success: false
                data: null
                errors:
                  - code: 400
                    message: "caseId - Value must be a valid bson object ID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Billing refused the session — your account cannot be charged for it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: The session could not be started — for example the entity does not belong to the case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                success: false
                data: null
                errors:
                  - code: 500
                    message: entity id could not be found within the linked entities of case
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/cfm/case/types:
    get:
      tags:
        - cfm
      summary: Retrieve available case types.
      description: |
        Returns the merchant's case types together with the risk level configured for each, newest first. Only
        case types that have a risk level relation are returned, since a case type without one cannot start a
        CFM session.

        A case type can be linked to a different risk level per entity type (person or company); only one of them
        is reported here, so `riskLevel` may not be the one `POST /v1/cfm/case/init` uses for the other entity
        type. Hidden case types are included, but `POST /v1/cfm/case/init` rejects them.

        Each case type carries `caseStatusSetId` — see `GET /v1/case/status-sets/{statusSetId}`.

        Requires the **cfm:viewer** and **case:viewer** roles.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The merchant's case types with their risk levels.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      caseTypes:
                        type: array
                        items:
                          $ref: "#/components/schemas/CaseType"
                  errors:
                    type: array
                    nullable: true
                    items:
                      type: object
              example:
                success: true
                data:
                  caseTypes:
                    - id: unique_id
                      name: Passport Check
                      group: Onboarding
                      customFieldSetId: null
                      caseStatusSetId: unique_id
                      riskLevel:
                        id: unique_id
                        name: Standard
                        applyOCRDuringFastFail: true
                errors: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: The case types could not be loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/cfm/risk-levels:
    get:
      tags:
        - cfm
      summary: List risk levels.
      description: |
        Returns your account's risk levels, newest first, each with the ids of the case types it is linked to.
        A risk level decides the journey an entity goes through; pass its `id` as `riskLevelId` to
        `POST /v1/cfm/case/init` or `POST /v1/cfm/entity/init`.

        Requires the **cfm:viewer** role.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The risk levels of your account.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          riskLevels:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                name:
                                  type: string
                                caseTypes:
                                  type: array
                                  description: Ids of the case types this risk level is linked to. Empty when none.
                                  items:
                                    type: string
              example:
                success: true
                data:
                  riskLevels:
                    - id: 66f1b5b3e6b1f2c8a4d7e8fa
                      name: Standard
                      caseTypes:
                        - 66f1b5b3e6b1f2c8a4d7e8f1
                    - id: 66f1b5b3e6b1f2c8a4d7e8fb
                      name: Enhanced
                      caseTypes: []
                errors: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: The risk levels could not be loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/case/case/{caseID}:
    get:
      tags:
        - case
      summary: Get detailed information about a specific case by its ID.
      description: |
        Returns the full case payload including all Person and Company entities, and a `files[]` array of documents
        uploaded manually against the case (documents that are not part of a CFM flow). Each file entry carries
        `id`, `fileName`, `entityId` (a string when the document was uploaded against a specific entity, or `null`
        when uploaded against the case itself), and the standard `audit` block.

        Every AML search linked to an entity also appears in that entity's `documents[]` array as an entry with
        `documentType: "AML Screening"`, alongside the identity, selfie and form documents. It carries the search's
        verification `currentStatus`, the `statuses[]` history and the reviewer's notes, in the same shape as every
        other reviewable document. This applies to searches linked before the feature shipped too — existing links
        were backfilled.

        `files[]` on that entry holds the AML certificate when one was produced. Searches created through
        `POST /v1/aml/search` or linked with `POST /v1/case/cases/{caseid}/{entityid}/{complyid}/link` produce no
        certificate, so their `files[]` is empty; searches run as part of a CFM journey normally have one. The
        entity's `searches[]` array remains the place to read the AML search itself (`complySearchId`, `searchTerm`,
        `hits`); note that the `documents[]` entry does not repeat those fields, so when an entity has more than one
        linked search the certificate in `files[]` is what ties an entry to a particular search.

        A case that does not exist, or belongs to another account, answers **400**, not 404.

        With audit translation enabled on your account, `actorId` in the audit blocks carries a display name (the
        API key name or the user's email) instead of an id.

        Requires the **case:viewer** role.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: caseID
          required: true
          schema:
            type: string
          description: The ID of the case to retrieve.
      responses:
        "200":
          description: Raw JSON containing detailed case information.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
