  /v1/case/case/{caseId}/{docId}:
    get:
      tags:
        - cfm
      summary: Download a file associated with a document in a specific case.
      description: >
        Streams a single stored file. `docId` must be a **file** id, not a grouped document id: take it from
        `documents[].files[].id` on `GET /v1/case/case/{caseID}`, or from `steps[].outputs[].documents[].id` on
        `GET /v1/case/case/session/{case_id}/{entity_id}`.


        For AML Screening steps in particular, `steps[].documents[]` holds the grouped document id and passing
        that value here will not resolve a file.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: caseId
          required: true
          schema:
            type: string
          description: The ID of the case to retrieve the document from.
        - in: path
          name: docId
          required: true
          schema:
            type: string
          description: >
            The ID of the file to download, as returned in `documents[].files[].id` or
            `steps[].outputs[].documents[].id`.
      responses:
        "200":
          description: File stream of the requested document.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: >
            Bad Request - Invalid input parameters, or no file with that id exists on the case. A file that cannot
            be found is reported as a 400 with error code 1011, not as a 404.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    nullable: true
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          format: int32
                        message:
                          type: string
              examples:
                badRequestExample:
                  value:
                    {
                      "success": false,
                      "data": null,
                      "errors":
                        [
                          {
                            "code": 400,
                            "message": "docId - Value must be a valid bson object ID",
                          },
                        ],
                    }
                notFoundExample:
                  value:
                    {
                      "success": false,
                      "data": null,
                      "errors":
                        [
                          {
                            "code": 1011,
                            "message": "unable to get document by id",
                          },
                        ],
                    }

