                  repPhoneNum: "+35679111111"
                  compPhoneNum: "+35621222333"
                  compEmailAddress: "info@acme.example"
                  compStatus: "Active"
                  uniqueCheck: false
                  customFields:
                    industryCode: "K64"
      responses:
        "200":
          description: Company created and linked to the case successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: True when the company was created successfully.
                  data:
                    type: object
                    description: Set to 'null' in case of an error.
                    properties:
                      id:
                        type: string
                        description: The ObjectId of the newly created company.
                  errors:
                    type: array
                    nullable: true
                    description: Set to 'null' when the request is successful.
                    items:
                      type: object
              example:
                success: true
                data:
                  id: "64b1f0a2c9e77aabcd987654"
                errors: null
        "400":
          description: >
            A required field is missing, an id or value is invalid, the case does not exist, or a required custom
            field is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              examples:
                badRequestExample:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 400
                        message: name - Value must not be empty
                allowListExample:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 400
                        message: bad request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Conflict - uniqueCheck was set and a company with the same registration number already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              examples:
                conflictExample:
                  value:
                    {
                      "success": false,
                      "data": null,
                      "errors":
                        [
                          {
                            "code": 409,
                            "message": "company already exists with registration num: C12345\n",
                          },
                        ],
                    }
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: The company could not be created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/case/types:
    get:
      tags:
        - case
      summary: List case types.
      description: |
        Returns all case types of your account with the case status set each one is bound to. Use
        `caseStatusSetId` with `GET /v1/case/status-sets/{statusSetId}` to list the statuses a case of that type
        can be in.

        Unlike `GET /v1/cfm/case/types`, this list includes case types that have no risk level (and hidden case
        types), and does not include risk level details.

        Requires the **case:viewer** role.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The case types of your account.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/SimplifiedCaseType"
              example:
                success: true
                data:
                  - id: 66f1b5b3e6b1f2c8a4d7e8f1
                    name: Individual Onboarding
                    caseStatusSetId: 66f1b5b3e6b1f2c8a4d7e8c1
                  - id: 66f1b5b3e6b1f2c8a4d7e8f2
                    name: Corporate Onboarding
                    caseStatusSetId: 66f1b5b3e6b1f2c8a4d7e8c1
                errors: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: The case types could not be loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

