openapi: 3.0.0
info:
  title: QGen Direct (Arritech's QGen Online API)
  version: "1.0.0"
  description: |
    This API enables Arritech clients to integrate their systems with QGen Online to access our services.
    It is written supporting the openAPI standards and all data returned is in JSON format. 

    Requests should be directed to the appropriate API URL 
    - Development: https://qgenonlinedev.com/integration-api/
    - Production: Contact Arritech for details

    All API requests must be made over HTTPS. HTTP is not supported! 
    See the authentication section for information on correctly authenticating calls 
    to the QGen Direct API.
    For any queries please contact: support@qgengroup.com

    # Generate API Key

    Login to qgenonline.com with a user that has credentials to generate API keys. In the **Settings** menu 
    you will find the **Generate API key** sub menu. Click on it and fill in the form.
    For security reasons, we recommend you specify the IP address of your client accessing our API. If left 
    empty, IP whitelisting is disabled, meaning that all IPs will have access to the API.

    # How to use the API explorer

    This page allows you to test the APIs directly without any coding. It's great to test some examples and
    make sure your keys are working and the servers are connected. Start by clicking the 
    **Try it out** button in the Login section. This will allow you to edit the body parameters with your
    clientID and secret Key as generated from QGen Online page.

    From the response, cut the access_token value (whatever is inside the quotations) and paste it in the 
    **value** field shown when you press the **Authorize** button shown here.

    You can then press the **Try it now** buttons on the other endpoints, edit the values of the fields in
    the *Body*  and press **Execute**

    # Responses and errors

    Every response, success or failure, uses the same JSON envelope:

    ```json
    { "success": true, "data": { }, "errors": null }
    ```

    - `success` — `true` when the request succeeded.
    - `data` — the endpoint's payload, or `null` on failure (and for operations that return nothing).
    - `errors` — `null` on success; otherwise a list of `{ code, data, message }`.
    - `publicError` — present on some failures (authentication, authorisation, throttling) as
      `{ statusCode, errorCode, message, data }`.

    **Rely on the HTTP status code, not on `errors[0].code`.** The HTTP status is derived from the whole
    chain of errors behind the failure, while `errors[0].code` is the outermost one. The two often differ —
    for example a record that does not exist answers **HTTP 400** with an `errors[0].code` of `500` or `1011`.

    Status codes common to every authenticated endpoint:

    | Status | When |
    |---|---|
    | 400 | Validation failed, a referenced record does not exist, or the body contains a field the endpoint does not know (unknown JSON fields are rejected). |
    | 401 | The bearer token is missing, invalid or expired (`Access Denied`), or the API key lacks the role the endpoint requires (`Unauthorized Access - Missing role`). |
    | 429 | The rate limit was exceeded (`Limit exceeded`). |
    | 503 | Authentication could not be checked at the moment (`Service temporarily unavailable`). Retry later. |

    # Roles

    Each API key is granted module roles, written `module:level` — for example `case:viewer`. Within a module
    the levels are additive: `admin` includes `operator`, which includes `viewer`. Every endpoint states the
    role it requires; where two roles are joined with **and**, the key needs both.

    # Case types, status sets and statuses

    Each case type is bound to a **case status set** — the list of statuses a case of that type can be in.
    To find the statuses available to a case type:

    1. List the case types with `GET /v1/case/types` (or `GET /v1/cfm/case/types`) and take the case type's
       `caseStatusSetId`.
    2. Call `GET /v1/case/status-sets/{statusSetId}` with that id. The response lists the set's statuses
       (`id` and `name`) and its default status.

    `GET /v1/case/statuses` returns every status of your account regardless of status set.

