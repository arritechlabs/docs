                        timestamp: "2026-10-01T09:30:00Z"
                      modifiedBy: null
                  total: 1
                errors: null
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              examples:
                invalidStatus:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 400
                        data: null
                        message: statusId - Value must be non empty a valid bson object ID
                invalidPage:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 400
                        data: null
                        message: page - Value must be greater than 0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: The cases could not be loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/case/cases/type:
    post:
      tags:
        - case
      summary: List cases of a case type.
      description: |
        Returns a page of your cases of the given case type, with the total number of matches.
