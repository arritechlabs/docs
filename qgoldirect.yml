  /v1/case/status-sets/{statusSetId}:
    get:
      tags:
        - case
      summary: Get a case status set.
      description: |
        Returns one case status set with its statuses (`id` and `name`) and its default status. Take the id from
        a case type's `caseStatusSetId` (`GET /v1/case/types` or `GET /v1/cfm/case/types`) to find the statuses a
