  /v1/case/status/{caseId}:
    get:
      tags:
        - case
      summary: Get a lightweight status snapshot for a case and its entities.
      description: |
        Returns the current status of a case and its entities in a small
        payload designed to be polled at a reasonable interval. Use it to drive
        your own onboarding flow off QGen Online state without fetching the full
        case payload (`GET /v1/case/case/{caseID}`). Subsequent polls reflect any
        status changes. This complements, and does not replace, the existing webhooks.

        `entities` lists the entities that have a status record, most recently changed first.

        When an entity has an open CFM session — not completed, not terminated and not expired — its
        `pendingSessionId` is included. To get the session's URL, use
        `GET /v1/case/case/session/{case_id}/pending`, which returns the links of sessions that have not been
        opened yet. A session the end user has already opened is not listed there.

        A case that does not exist, or belongs to another account, answers **400**.

        Requires the **case:viewer** role.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: caseId
          required: true
          schema:
            type: string
          description: The ID of the case to poll.
      responses:
        "200":
          description: Current status of the case and its entities.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required:
                      - caseId
                      - caseStatus
                      - lastUpdated
                      - entities
                    properties:
                      caseId:
                        type: string
                        description: The ID of the case.
                      caseStatus:
                        type: string
                        description: The case's current status name.
                      lastUpdated:
                        type: string
                        format: date-time
                        description: When the case was last modified.
                      entities:
                        type: array
                        items:
                          type: object
                          required:
                            - entityId
                            - status
                            - lastUpdated
                          properties:
                            entityId:
                              type: string
                              description: >
                                The entity (link) ID. The same ID is accepted by
                                the case session endpoint.
                            status:
                              type: string
                              enum:
                                - Created
                                - AwaitingVerification
                                - PendingApproval
                                - Approved
                                - Completed
                                - Inactive
                                - Archived
                                - Verified
                                - Referred
                                - VerificationFailed
                                - VerificationIssue
                              description: The entity's current status.
                            lastUpdated:
                              type: string
                              format: date-time
                              description: When this entity's status last changed.
                            pendingSessionId:
                              type: string
                              description: >
                                Present only when the entity has an open CFM
                                session — not completed, not terminated and not expired.
                  errors:
                    type: array
                    nullable: true
                    items:
                      $ref: "#/components/schemas/ErrorItem"
              examples:
                caseStatusSummaryExample:
                  value:
                    {
                      "success": true,
                      "data":
                        {
                          "caseId": "66e2c1a4f1a2b3c4d5e6f7a8",
                          "caseStatus": "In Review",
                          "lastUpdated": "2026-07-15T09:12:00.000Z",
                          "entities":
                            [
                              {
                                "entityId": "66e2c1a4f1a2b3c4d5e6f7b1",
                                "status": "AwaitingVerification",
                                "lastUpdated": "2026-07-15T09:10:00.000Z",
                                "pendingSessionId": "66e2c1a4f1a2b3c4d5e6f7c9",
                              },
                              {
                                "entityId": "66e2c1a4f1a2b3c4d5e6f7b2",
                                "status": "Approved",
                                "lastUpdated": "2026-07-14T16:41:00.000Z",
                              },
                            ],
                        },
                      "errors": null,
                    }
        "400":
          description: The case id is not valid, or no case of your account has this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                success: false
                data: null
                errors:
                  - code: 400
                    message: caseId - Value must be a valid bson object ID
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: The case status could not be loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/case/cases/{caseid}/{entityid}/{complyid}/link:
    post:
      tags:
        - case
      summary: Link an AML search to an entity within a case.
      description: >
        Links an existing AML search to a Person or Company on the case. Linking also creates the search's
        `"AML Screening"` grouped document on that entity, which is what makes the search reviewable: it appears in
        the entity's `documents[]` on `GET /v1/case/case/{caseID}` carrying a verification status, notes and history.
        No AML certificate is produced on this path, so the entry's `files[]` is empty.

        A search can be linked to only one entity. Linking a search that is already linked — to this or to any other
        entity of your account — is refused with **400** (`Link already exists`); unlink it first. (When the search
        already has a grouped document from a CFM journey but no live link, that document is reused rather than a
        second one added.)

        Requires the **aml:operator** and **case:operator** roles.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: caseid
          required: true
          schema:
            type: string
          description: The ID of the case containing the entity.
        - in: path
          name: entityid
          required: true
          schema:
            type: string
          description: The ID of the entity (person/company) to link the AML search to.
        - in: path
          name: complyid
          required: true
          schema:
            type: string
          description: The ID of the AML search to link to the entity.
      responses:
        "200":
          description: The AML search was linked. `data` is null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                success: true
                data: null
                errors: null
        "400":
          description: >
            An id is not valid, the case or entity does not exist, or the search is already linked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              examples:
                invalidId:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 400
                        message: caseid - Value must be a valid bson object ID
                alreadyLinked:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 400
                        message: Link already exists
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: >
            The link could not be changed, for example because the AML search could not be found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                success: false
                data: null
                errors:
                  - code: 1103
                    message: Unable to find comply search
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/case/cases/{caseid}/{entityid}/{complyid}/unlink:
    post:
      tags:
        - case
      summary: Unlink an AML search from an entity within a case.
      description: >
        Removes the link between an AML search and an entity on the case, and deletes the search's
        `"AML Screening"` grouped document along with it, so the entity is not left with a reviewable card for a
        search it is no longer linked to. Unlinking a search that has no grouped document — one linked before AML
        grouped documents existed and not covered by the backfill — succeeds and removes only the link.

        Unlinking a search that is not linked is refused with **400** (`Link does not exist`).

        Requires the **aml:operator** and **case:operator** roles.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: caseid
          required: true
          schema:
            type: string
          description: The ID of the case containing the entity.
        - in: path
          name: entityid
          required: true
          schema:
            type: string
          description: The ID of the entity (person/company) to unlink the AML search from.
        - in: path
          name: complyid
          required: true
          schema:
            type: string
          description: The ID of the AML search to unlink from the entity.
      responses:
        "200":
          description: The AML search was unlinked. `data` is null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                success: true
                data: null
                errors: null
        "400":
          description: >
            An id is not valid, the case or entity does not exist, or the search is not linked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              examples:
                invalidId:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 400
                        message: caseid - Value must be a valid bson object ID
                notLinked:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 400
                        message: Link does not exist
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: >
            The link could not be changed, for example because the AML search could not be found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                success: false
                data: null
                errors:
                  - code: 1103
                    message: Unable to find comply search
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/case/case/{caseId}/{docId}:
    get:
      tags:
        - case
      summary: Download a file associated with a document in a specific case.
      description: >
        Streams a single stored file. `docId` must be a **file** id, not a grouped document id: take it from
        `documents[].files[].id` on `GET /v1/case/case/{caseID}`, or from `steps[].outputs[].documents[].id` on
        `GET /v1/case/case/session/{case_id}/{entity_id}`.


        For AML Screening steps in particular, `steps[].documents[]` holds the grouped document id and passing
        that value here will not resolve a file.


        The response carries the raw file bytes. No `Content-Type` or `Content-Disposition` is set by the API, so
        the content type is detected from the file and you should name the file yourself (`fileName` from the case
        payload). When the request sends `Accept-Encoding: gzip`, the body is gzip-compressed and has no
        `Content-Length`.


        Requires the **case:viewer** role.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: caseId
          required: true
          schema:
            type: string
          description: The ID of the case to retrieve the document from.
        - in: path
          name: docId
          required: true
          schema:
            type: string
          description: >
            The ID of the file to download, as returned in `documents[].files[].id` or
            `steps[].outputs[].documents[].id`.
      responses:
        "200":
          description: >
            The file's bytes. The `Content-Type` is detected from the content (for example `image/jpeg` or
            `application/pdf`).
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: >
            An id is not valid, or no file of your account has this id. A file that cannot be found is reported
            as a 400, not as a 404.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              examples:
                badRequestExample:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 400
                        message: bad request
                notFoundExample:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 500
                        message: unable to get document by id
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: The file could not be read from storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/cfm/webhook/logs/{sessionID}:
    get:
      tags:
        - cfm
      summary: Retrieve webhook logs for the case of a session.
      description: |
        Returns the webhook delivery logs of the **case** the given session belongs to — every webhook sent for
        that case, across all of its sessions and entities, not only the ones for this session. Filter on
        `sessionID` or `entityID` if you need a single session's logs.

        An unknown session id answers **400**.

        Requires the **cfm:viewer** and **case:viewer** roles.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionID
          required: true
          schema:
            type: string
          description: The ID of the session to retrieve.
      responses:
        "200":
          description: Raw JSON message containing the webhook logs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      logs:
                        type: array
                        items:
                          type: object
                          properties:
                            ID:
                              type: string
                            merchantID:
                              type: string
                            referenceID:
                              type: string
                              nullable: true
                            sessionID:
                              type: string
                              nullable: true
                            riskLevelID:
                              type: string
                              nullable: true
                            journeyID:
                              type: string
                              nullable: true
                            caseID:
                              type: string
                            entityID:
                              type: string
                              nullable: true
                            entityType:
                              type: string
                              enum: [person, company]
                              description: The kind of entity the event relates to. Omitted on older logs.
                            caseTypeID:
                              type: string
                              nullable: true
                            webhookID:
                              type: string
                            webhookName:
                              type: string
                              description: The webhook's name when the event was sent (kept even if the webhook is later deleted).
                            locale:
                              type: string
                              nullable: true
                            eventType:
                              type: string
                            payload:
                              type: object
                              additionalProperties: true
                              description: >
                                The event payload as sent to your endpoint. Its fields depend on `eventType`; the properties below are
                                those of `cfm_case_created_event`.
                              properties:
                                caseID:
                                  type: string
                                caseTypeID:
                                  type: string
                                entityID:
                                  type: string
                                journeyID:
                                  type: string
                                locale:
                                  type: string
                                merchantID:
                                  type: string
                                referenceID:
                                  type: string
                                riskLevelID:
                                  type: string
                                sessionID:
                                  type: string
                            endpoint:
                              type: string
                            statusCode:
                              type: integer
                              nullable: true
                            response:
                              type: string
                              nullable: true
                            clientErr:
                              type: string
                              nullable: true
                            status:
                              type: string
                              enum: [New, Failed, Succeed]
                            createdAt:
                              type: string
                              format: date-time
                            modifiedAt:
                              type: string
                              format: date-time
                              nullable: true
                  errors:
                    type: array
                    nullable: true
                    items:
                      type: object
              examples:
                webhookLogsExample:
                  value:
                    {
                      "success": true,
                      "data":
                        {
                          "logs":
                            [
                              {
                                "ID": "unique_id",
                                "merchantID": "unique_id",
                                "referenceID": "unique_id",
                                "sessionID": "unique_id",
                                "riskLevelID": "unique_id",
                                "journeyID": "unique_id",
                                "caseID": "unique_id",
                                "entityID": "unique_id",
                                "caseTypeID": "unique_id",
                                "entityType": "person",
                                "webhookID": "unique_id",
                                "webhookName": "Case events",
                                "locale": "EN",
                                "eventType": "cfm_case_created_event",
                                "payload":
                                  {
                                    "caseID": "unique_id",
                                    "caseTypeID": "unique_id",
                                    "entityID": "unique_id",
                                    "journeyID": "unique_id",
                                    "locale": "EN",
                                    "merchantID": "unique_id",
                                    "referenceID": "unique_id",
                                    "riskLevelID": "unique_id",
                                    "sessionID": "unique_id",
                                  },
                                "endpoint": "https://qgenonlinedev.com/cfm-simulator-api/v1/webhook/create",
                                "statusCode": 200,
                                "response": "object",
                                "clientErr": null,
                                "status": "Succeed",
                                "createdAt": "2024-03-13T16:23:48.24Z",
                                "modifiedAt": "2024-03-13T16:23:48.279Z",
                              },
                            ],
                        },
                      "errors": null,
                    }
        "400":
          description: The session id is not valid, or no session of your account has this id.
          content:
            application/json:
              schema:
