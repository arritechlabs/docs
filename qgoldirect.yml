components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        ## Security Scheme: JWT Bearer Token

        This API uses JWT (JSON Web Token) for authentication and authorization.

        ### Generating a Token

        After successful login through the `/v1/public/login` endpoint, a JWT token is returned in the response. This token must be included in the `Authorization` header for all other secure endpoints.

        ### Storing the Token

        **Important:** It's crucial to securely store the JWT token on the client-side to prevent unauthorized access. We recommend encrypting the token and storing it in a secure storage solution. 

        ### Transmitting the Token

        **All API requests must be made over HTTPS.** Tokens should never be transmitted over a non-secure connection.

        ### Token Expiry

        Tokens are short-lived and should be regenerated before expiry. The expiry time is included in the login response.

        ### Sample Header

        ```http
        Authorization: Bearer YOUR_JWT_TOKEN_HERE
        ```
  schemas:
    Envelope:
      type: object
      description: The envelope every response is wrapped in.
      properties:
        success:
          type: boolean
          description: Whether the request succeeded.
        data:
          description: The endpoint's payload, or null on failure.
        errors:
          type: array
          nullable: true
          description: Null on success; otherwise the errors that caused the failure.
          items:
            $ref: "#/components/schemas/ErrorItem"
        publicError:
          $ref: "#/components/schemas/PublicError"

    ErrorItem:
      type: object
      properties:
        code:
          type: integer
          description: >
            Error code of the outermost error. It does not always match the HTTP status — rely on the HTTP status.
        data:
          description: Additional error data, usually null.
        message:
          type: string
          description: Human-readable error message.

    PublicError:
      type: object
      description: Present on some failures (authentication, authorisation, throttling).
      properties:
        statusCode:
          type: integer
        errorCode:
          type: integer
        message:
          type: string
        data:
          description: Additional error data, usually null.

    Actor:
      type: object
      description: Who performed an action, and when.
      properties:
        actorType:
          type: string
          description: "The kind of actor: `User`, `Api` (an API key) or `System`."
        actorId:
          type: string
          description: The actor's identifier.
        timestamp:
          type: string
          format: date-time

    SimplifiedCaseType:
      type: object
      properties:
        id:
          type: string
          description: Case type id.
        name:
          type: string
        caseStatusSetId:
          type: string
          description: >
            The case status set bound to this case type. Pass it to `GET /v1/case/status-sets/{statusSetId}`
            to list the statuses a case of this type can be in.

    SimplifiedCaseStatus:
      type: object
      properties:
        id:
          type: string
          description: Case status id — the value to pass as `statusId`.
        name:
          type: string
          description: The status label.

    CaseStatusSet:
      type: object
      properties:
        id:
          type: string
          description: Case status set id.
        name:
          type: string
        description:
          type: string
        isDefault:
          type: boolean
          description: Whether this is your account's default status set.
        defaultStatusId:
          type: string
          description: The status a new case of a type bound to this set starts in.
        statuses:
          type: array
          description: >
            The statuses in the set, in the set's order. A status that has since been deleted is left out.
          items:
            $ref: "#/components/schemas/SimplifiedCaseStatus"

    SummarisedCase:
      type: object
      properties:
        ID:
          type: string
          description: Case id. Note the upper-case key.
        statusID:
          type: string
        caseTypeID:
          type: string
        number:
          type: string
          description: Your case number / reference.
        summary:
          type: string
        entities:
          type: integer
          description: Number of entities (persons and companies) on the case.
        documents:
          type: integer
          description: Number of documents on the case.
        createdBy:
          $ref: "#/components/schemas/Actor"
        modifiedBy:
          type: object
          nullable: true
          description: Who last modified the case, or null when it has not been modified.
          properties:
            actorType:
              type: string
            actorId:
              type: string
            timestamp:
              type: string
              format: date-time

    SummarisedCases:
      type: object
      properties:
        recs:
          type: array
          items:
            $ref: "#/components/schemas/SummarisedCase"
        total:
          type: integer
          format: int64
          description: The number of matching cases across all pages.

    Audit:
      type: object
      description: Who created, last modified and deleted a record.
      properties:
        revisionID:
          type: integer
        createdBy:
          $ref: "#/components/schemas/Actor"
        modifiedBy:
          type: object
          nullable: true
          description: Same shape as `createdBy`; null until the record is modified.
          properties:
            actorType:
              type: string
            actorId:
              type: string
            timestamp:
              type: string
              format: date-time
        deletedBy:
          type: object
          nullable: true
          description: Same shape as `createdBy`; null unless the record was deleted.
          properties:
            actorType:
              type: string
            actorId:
              type: string
            timestamp:
              type: string
              format: date-time

    CaseAMLSearch:
      type: object
      description: An AML search linked to the entity.
      properties:
        id:
          type: string
          description: The id of the link between the search and the entity.
        status:
          type: string
          enum: [Pending, Completed]
        complySearchId:
          type: string
          description: The AML search id — use it with `POST /v1/aml/search/{id}`.
        searchTerm:
          type: string
        searchDate:
          type: string
          format: date-time
        hits:
          type: integer
          minimum: 0
        audit:
          $ref: "#/components/schemas/Audit"

    CaseFile:
      type: object
      properties:
        id:
          type: string
          description: File id — download it with `GET /v1/case/case/{caseId}/{docId}`.
        fileName:
          type: string
        audit:
          $ref: "#/components/schemas/Audit"

    CaseDocument:
      type: object
      properties:
        id:
          type: string
        documentType:
          type: string
          description: e.g. an identity document, a selfie, a form or `AML Screening`.
        currentStatus:
          type: string
        statuses:
          type: array
          description: The verification status history.
          items:
            type: object
            properties:
              status:
                type: string
              notes:
                type: string
              actor:
                $ref: "#/components/schemas/Actor"
        verificationMethod:
          type: string
        metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: Document-specific data, e.g. the fields read from an identity document.
        files:
          type: array
          items:
            $ref: "#/components/schemas/CaseFile"
        audit:
          $ref: "#/components/schemas/Audit"

    CasePerson:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        name:
          type: string
        surname:
          type: string
        emailAddress:
          type: string
        phoneNum:
          type: string
        gender:
          type: string
        addressLine1:
          type: string
        addressLine2:
          type: string
        postCode:
          type: string
        country:
          type: string
        nationality:
          type: string
        dob:
          type: string
          description: Date of birth.
        searches:
          type: array
          items:
            $ref: "#/components/schemas/CaseAMLSearch"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/CaseDocument"
        audit:
          $ref: "#/components/schemas/Audit"

    CaseCompany:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        tradeName:
          type: string
        regNum:
          type: string
        regDate:
          type: string
        regCountry:
          type: string
        addressLine1:
          type: string
        addressLine2:
          type: string
        postCode:
          type: string
        country:
          type: string
        businessType:
          type: string
        companyType:
          type: string
        vatNum:
          type: string
        repName:
          type: string
        repEmailAddress:
          type: string
        repPhoneNum:
          type: string
        compPhoneNum:
          type: string
        compEmailAddress:
          type: string
        compStatus:
          type: string
        searches:
          type: array
          items:
            $ref: "#/components/schemas/CaseAMLSearch"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/CaseDocument"
        audit:
          $ref: "#/components/schemas/Audit"

    CaseDetail:
      type: object
      properties:
        id:
          type: string
        reference:
          type: string
          description: Your case number / reference.
        summary:
          type: string
        description:
          type: string
        persons:
          type: array
          items:
            $ref: "#/components/schemas/CasePerson"
        companies:
          type: array
          items:
            $ref: "#/components/schemas/CaseCompany"
        files:
          type: array
          description: Documents uploaded manually against the case, outside a CFM flow.
          items:
            type: object
            properties:
              id:
                type: string
              fileName:
                type: string
              entityId:
                type: string
                nullable: true
                description: The entity the file was uploaded against, or null when uploaded against the case.
              audit:
                $ref: "#/components/schemas/Audit"
        caseType:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            caseStatusSetId:
              type: string
              description: >
                The case status set of the case type, as recorded on the case — the statuses the case can be in are
                listed by `GET /v1/case/status-sets/{statusSetId}`. The case keeps the copy of its case type taken
                when the case was created or last edited, so if the case type has since been moved to another status
                set, `GET /v1/case/types` shows the current one. Empty for cases recorded before status sets existed.
        caseStatus:
          $ref: "#/components/schemas/SimplifiedCaseStatus"
        casePriority:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        audit:
          $ref: "#/components/schemas/Audit"

    IPInfo:
      type: object
      properties:
        ipAddress:
          type: string
        ipCountry:
          type: string
        agentInfo:
          type: object
          properties:
            browser:
              type: string
            operatingSystem:
              type: string
            device:
              type: string
            deviceType:
              type: string

    SessionStepFile:
      type: object
      description: A stored file produced by a step.
      properties:
        id:
          type: string
          description: File id — download it with `GET /v1/case/case/{caseId}/{docId}`.
        key:
          type: string
        fileName:
          type: string
        documentType:
          type: string
        documentSide:
          type: string
        mimeType:
          type: string
          nullable: true
        extension:
          type: string
          nullable: true
        size:
          type: integer
          format: int64

    SessionStep:
      type: object
      description: One completed step of a session.
      properties:
        stepNo:
          type: integer
        checkId:
          type: string
        checkName:
          type: string
        checkType:
          type: string
          description: >
            e.g. `Identity Documents`, `Selfie`, `AML Screening`, `Upload Document`, `Form`, `SMS`, `Basic Form`,
            `Proof Of Address`.
        documentType:
          type: string
          nullable: true
          description: The grouped document type the step produced, or null.
        ipInfo:
          $ref: "#/components/schemas/IPInfo"
        metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: >
            Step-specific data; its shape depends on `checkType`. For Identity Documents it carries `capturePath`
            (`automated`, `manual` or `forced_manual`), the path the document took during capture — see `capturePath`
            on cfm_journey_completed_event. It is absent on sessions completed before the field existed.
        settings:
          type: object
          nullable: true
          additionalProperties: true
          description: The check's settings when the step ran; the shape depends on `checkType`.
        documents:
          type: array
          nullable: true
          description: >
            Document ids recorded by the step. For AML Screening this is the grouped document id, not a file id.
          items:
            type: string
        outputs:
          type: array
          nullable: true
          items:
            type: object
            properties:
              id:
                type: string
                description: The grouped document id.
              documents:
                type: array
                items:
                  $ref: "#/components/schemas/SessionStepFile"
        decision:
          type: object
          nullable: true
          description: >
            The automatic verification decision for the step. Null for most step types; set on Upload Document
            steps that have a decision recorded.
          properties:
            status:
              type: string
              enum: [Awaiting Review, Verified, Rejected, Expired, Error]
            notes:
              type: string
            decisions:
              type: object
              additionalProperties: true
              description: The rule-engine result behind the decision.
            timestamp:
              type: string
              format: date-time
        cloned:
          type: boolean
          nullable: true
        previousSessionId:
          type: string
          nullable: true
          description: When the step was copied from an earlier session, that session's id.
        completedAt:
          type: string
          format: date-time

    CfmSession:
      type: object
      properties:
        sessionId:
          type: string
        journeyId:
          type: string
        linkId:
          type: string
        clientId:
          type: string
        messageId:
          type: string
          nullable: true
          description: The message the session link was sent in, if any.
        riskLevel:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            steps:
              type: object
              description: The risk level's steps, keyed by step number (`"1"`, `"2"`, …).
              additionalProperties:
                type: object
                properties:
                  stepNo:
                    type: integer
                  checkId:
                    type: string
                  checkName:
                    type: string
                  checkType:
                    type: string
                  settings:
                    type: object
                    nullable: true
                    additionalProperties: true
        ipInfo:
          $ref: "#/components/schemas/IPInfo"
        completed:
          type: boolean
        terminationState:
          type: string
          nullable: true
          enum: [UserGeoBlocked, FastFailInconclusive, UserDeniedTerms, TerminatedByOperator, null]
          description: Why the session was terminated, or null when it was not.
        terminationNotes:
          type: string
          nullable: true
        steps:
          type: object
          nullable: true
          description: The completed steps, keyed by step number (`"1"`, `"2"`, …).
          additionalProperties:
            $ref: "#/components/schemas/SessionStep"
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        cloned:
          type: boolean
          nullable: true
        previousSessionId:
          type: string
          nullable: true
          description: When this session continues an earlier one, that session's id.
        duration:
          type: number
          nullable: true

    EntitySessions:
      type: object
      properties:
        id:
          type: string
        merchantId:
          type: string
        caseId:
          type: string
        entityId:
          type: string
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/CfmSession"
        documents:
          type: array
          description: Documents produced by the entity's sessions.
          items:
            type: object
            properties:
              sessionId:
                type: string
              stepNo:
                type: integer
              checkType:
                type: string
              documentType:
                type: string
                nullable: true
              documentId:
                type: string
                nullable: true
              groupedDocumentId:
                type: string
                nullable: true
              outputs:
                type: array
                nullable: true
                items:
                  $ref: "#/components/schemas/SessionStepFile"
              cloned:
                type: boolean
                nullable: true
              previousSessionId:
                type: string
                nullable: true
              timestamp:
                type: string
                format: date-time
        faceComparisons:
          type: array
          items:
            type: object
            properties:
              sessionId:
                type: string
              source:
                $ref: "#/components/schemas/FaceImage"
              target:
                $ref: "#/components/schemas/FaceImage"
              success:
                type: boolean
              failReason:
                type: string
                nullable: true
              similarity:
                type: number
                nullable: true
                description: Similarity score of the two faces.
              sourceFace:
                type: object
                nullable: true
                additionalProperties: true
              targetFace:
                type: object
                nullable: true
                additionalProperties: true
              comparedFace:
                type: object
                nullable: true
                additionalProperties: true
              actor:
                $ref: "#/components/schemas/Actor"
              cloned:
                type: boolean
                nullable: true
              previousSessionId:
                type: string
                nullable: true
              createdAt:
                type: string
                format: date-time
        faceLivenessAttempts:
          type: array
          items:
            type: object
            properties:
              sessionId:
                type: string
              stepNo:
                type: integer
              statusCode:
                type: integer
              os:
                type: object
                nullable: true
                additionalProperties: true
              calibration:
                type: object
                nullable: true
                additionalProperties: true
              pipeline:
                type: object
                nullable: true
                additionalProperties: true
              response:
                type: object
                nullable: true
                additionalProperties: true
                description: The liveness provider's response.
              actor:
                $ref: "#/components/schemas/Actor"
              cloned:
                type: boolean
                nullable: true
              previousSessionId:
                type: string
                nullable: true
              timestamp:
                type: string
                format: date-time
        fastFailAttempts:
          type: array
          items:
            type: object
            properties:
              sessionId:
                type: string
              stepNo:
                type: integer
              apiResponse:
                type: object
                nullable: true
                additionalProperties: true
                description: The document reader's response.
              processParams:
                type: object
                nullable: true
                additionalProperties: true
              apiStatus:
                type: string
                nullable: true
              apiStatusCode:
                type: integer
                nullable: true
              apiRawResponse:
                type: string
                nullable: true
              apiFailReason:
                type: string
                nullable: true
              failReason:
                type: string
                nullable: true
              fastFailStatus:
                type: string
                nullable: true
              cloned:
                type: boolean
                nullable: true
              previousSessionId:
                type: string
                nullable: true
              actor:
                $ref: "#/components/schemas/Actor"
              timestamp:
                type: string
                format: date-time
        revisionID:
          type: integer
        createdBy:
          $ref: "#/components/schemas/Actor"
        modifiedBy:
          type: object
          nullable: true
          description: Same shape as `createdBy`; null until the record is modified.
          properties:
            actorType:
              type: string
            actorId:
              type: string
            timestamp:
              type: string
              format: date-time
        deletedBy:
          type: object
          nullable: true
          description: Same shape as `createdBy`; null unless the record was deleted.
          properties:
            actorType:
              type: string
            actorId:
              type: string
            timestamp:
              type: string
              format: date-time

    FaceImage:
      type: object
      properties:
        documentId:
          type: string
        groupedDocumentId:
          type: string
        documentType:
          type: string
        image:
          type: object
          properties:
            key:
              type: string
            bucketName:
              type: string

    CasesFilterPaging:
      type: object
      properties:
        page:
          type: integer
          format: int64
          minimum: 1
          description: The page to return, starting at 1.
        limit:
          type: integer
          format: int64
          minimum: 1
          description: The number of cases per page.
        orderBy:
          type: string
          description: >
            The field to sort by, using the stored field name — for example `number` or `created_by.timestamp`.
            Defaults to the case id, which follows creation order.
        orderByDesc:
          type: boolean
          default: false
          description: Sort descending instead of ascending.

    RiskLevel:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        applyOCRDuringFastFail:
          type: boolean
          description: >
            Whether entity details are auto-filled from the document read during a fast-fail check.

    CaseType:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        group:
          type: string
        customFieldSetId:
          type: string
          nullable: true
          description: The custom field set bound to this case type, or null when none is configured.
        caseStatusSetId:
          type: string
          description: >
            The case status set bound to this case type. Pass it to `GET /v1/case/status-sets/{statusSetId}`
            to list the statuses a case of this type can be in.
        riskLevel:
          $ref: "#/components/schemas/RiskLevel"

    BaseEvent:
      type: "object"
      description: "Base structure for all webhook events."
      properties:
        id:
          type: "string"
          description: "Unique ID for the webhook event."
        merchantID:
          type: "string"
          description: "This is your merchant identifier. It's your unique identifier across other QGen Online Merchants and never changes"
        eventType:
          type: "string"
          description: |
            This can only be one of the events described below 
            and will indicate the structure to expect in the next field labelled 'payload'.
            Expect a string as follows e.g. 'cfm_case_created_event' or
            'cfm_entity_rejected_terms_event'
        payload:
          type: "object"
          description: "Event-specific data payload as per details described below."

    cfm_case_created_event:
      type: "object"
      properties:
        caseID:
          type: "string"
          description: "ID of the case."
        caseTypeID:
          type: "string"
          description: "Type ID of the case."
        entityID:
          type: "string"
          description: "ID of the associated entity."
        journeyID:
          type: "string"
          description: "ID of the journey associated with the case."
        locale:
          type: "string"
          description: "Language/locale setting for the case."
        merchantID:
          type: "string"
          description: "ID of the merchant involved."
        referenceID:
          type: "string"
          description: "Reference ID associated with the case."
        riskLevelID:
          type: "string"
          description: "Risk level ID assigned to the case."
        sessionID:
          type: "string"
          description: "Session ID associated with the case."

    cfm_entity_rejected_terms_event:
      type: "object"
      properties:
        caseID:
          type: "string"
          description: "ID of the case."
        caseTypeID:
          type: "string"
          description: "Type ID of the case."
        entityID:
          type: "string"
          description: "ID of the associated entity."
        journeyID:
          type: "string"
          description: "ID of the journey associated with the case."
        locale:
          type: "string"
          description: "Language/locale setting for the case."
        merchantID:
          type: "string"
          description: "ID of the merchant involved."
        referenceID:
          type: "string"
          description: "Reference ID associated with the case."
        riskLevelID:
          type: "string"
          description: "Risk level ID assigned to the case."
        sessionID:
          type: "string"
          description: "Session ID associated with the case."

    cfm_user_geo_blocked_event:
      type: "object"
      properties:
        merchantID:
          type: "string"
          description: "ID of the merchant involved."
        referenceID:
          type: "string"
          description: "Reference ID associated with the event."
        riskLevelID:
          type: "string"
          description: "Risk level ID assigned to the event."
        journeyID:
          type: "string"
          description: "ID of the journey associated with the case."
        IPAddress:
          type: "string"
          description: "IP address involved in the event."
        IPDetails:
          type: "object"
          properties:
            ip:
              type: "string"
              description: "IP address string."
            continentcode:
              type: "string"
              description: "Continent code derived from IP."
            continentname:
              type: "string"
              description: "Continent name derived from IP."
            countrycode:
              type: "string"
              description: "Country code derived from IP."
            countryname:
              type: "string"
              description: "Country name derived from IP."
            regioncode:
              type: "string"
              description: "Region code derived from IP."
            city:
              type: "string"
              description: "City derived from IP."
