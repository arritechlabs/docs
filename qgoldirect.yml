      responses:
        "200":
          description: The case status set.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CaseStatusSet"
              example:
                success: true
                data:
                  id: 66f1b5b3e6b1f2c8a4d7e8c1
                  name: Standard
                  description: Default onboarding statuses
                  isDefault: true
                  defaultStatusId: 66f1b5b3e6b1f2c8a4d7e8d1
                  statuses:
                    - id: 66f1b5b3e6b1f2c8a4d7e8d1
                      name: Open
                    - id: 66f1b5b3e6b1f2c8a4d7e8d2
                      name: In Review
                    - id: 66f1b5b3e6b1f2c8a4d7e8d3
                      name: Closed
                errors: null
        "400":
          description: The id is not valid, or no status set of your account has this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              examples:
                invalidId:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 400
                        data: null
                        message: statusSetId - Value must be a valid bson object ID
                notFound:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 400
                        data: null
                        message: case status set not found
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: The case status set could not be loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/case/cases/status:
    post:
      tags:
        - case
      summary: List cases in a status.
      description: |
        Returns a page of your cases that are in the given status, with the total number of matches.
        `page` and `limit` are required.

        Requires the **case:viewer** role.
