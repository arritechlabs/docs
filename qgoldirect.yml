                                                          type: "boolean"
                                                        verification:
                                                          type: "string"
                                                      type: "object"
                                                    dateOfBirth:
                                                      required:
                                                        - "ignoreIfNull"
                                                        - "verification"
                                                      properties:
                                                        ignoreIfNull:
                                                          type: "boolean"
                                                        verification:
                                                          type: "string"
                                                      type: "object"
                                                    gender:
                                                      required:
                                                        - "ignoreIfNull"
                                                        - "verification"
                                                      properties:
                                                        ignoreIfNull:
                                                          type: "boolean"
                                                        verification:
                                                          type: "string"
                                                      type: "object"
                                                    names:
                                                      required:
                                                        - "ignoreIfNull"
                                                        - "verification"
                                                      properties:
                                                        ignoreIfNull:
                                                          type: "boolean"
                                                        verification:
                                                          type: "string"
                                                      type: "object"
                                                    nationality:
                                                      required:
                                                        - "ignoreIfNull"
                                                        - "verification"
                                                      properties:
