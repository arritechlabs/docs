                  statusSets:
                    - id: 66f1b5b3e6b1f2c8a4d7e8c1
                      name: Standard
                      description: Default onboarding statuses
                      isDefault: true
                      defaultStatusId: 66f1b5b3e6b1f2c8a4d7e8d1
                      statuses:
                        - id: 66f1b5b3e6b1f2c8a4d7e8d1
                          name: Open
                        - id: 66f1b5b3e6b1f2c8a4d7e8d2
                          name: In Review
                        - id: 66f1b5b3e6b1f2c8a4d7e8d3
                          name: Closed
                errors: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: The case status sets could not be loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "503":
