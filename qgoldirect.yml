                data:
                  - id: 66f1b5b3e6b1f2c8a4d7e8d1
                    name: Open
                  - id: 66f1b5b3e6b1f2c8a4d7e8d2
                    name: In Review
                  - id: 66f1b5b3e6b1f2c8a4d7e8d3
                    name: Closed
                errors: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: The case statuses could not be loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/case/status-sets:
    get:
      tags:
        - case
      summary: List case status sets.
      description: |
        Returns all case status sets of your account, each with its statuses (`id` and `name`) and its default
        status.

        Requires the **case:viewer** role.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The case status sets of your account.
          content:
