  /v1/case/case/session/{case_id}/{entity_id}:
    get:
      summary: Get case session details
      description: >
        Retrieves session details for a given case and entity.


        **AML Screening steps.** `steps[n].documents[]` and `steps[n].outputs[n].id` carry the id of the
        step's *grouped document* — the reviewable record that holds the AML search's verification status,
        notes and history — and not the id of a downloadable file. The AML certificate, when one was
        produced, is one level down in `steps[n].outputs[n].documents[n]`, with `documentType`
        `"AML Screening"`; its `id` is the value to pass to `GET /v1/case/case/{caseId}/{docId}`. The same
        applies to the entry in the top-level `documents[]` array, which now carries `groupedDocumentId`
        for AML Screening (`documentId` is `null`). Sessions recorded before this change hold the
        certificate's document id in `steps[n].documents[]` and in `documents[].documentId`, with
        `groupedDocumentId` `null`.


        An AML Screening step is recorded even when no certificate was produced — a ComplyAdvantage
        outage leaves the search `Pending` and returns no binary — in which case
        `steps[n].outputs[n].documents` is empty but the grouped document id is still present.
      tags:
        - cfm
      security:
        - bearerAuth: []
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the case.
        - name: entity_id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the entity.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: "boolean"
                  data:
                    required:
                      - "sessions"
                    properties:
                      sessions:
                        required:
                          - "id"
                          - "merchantId"
                          - "caseId"
                          - "entityId"
                          - "sessions"
                          - "documents"
                          - "faceComparisons"
                          - "faceLivenessAttempts"
                          - "fastFailAttempts"
                          - "revisionID"
                          - "createdBy"
                          - "modifiedBy"
                          - "deletedBy"
                        properties:
                          id:
                            type: "string"
                          merchantId:
                            type: "string"
                          caseId:
                            type: "string"
                          entityId:
                            type: "string"
                          sessions:
                            type: "array"
                            items:
                              type: "object"
                              properties:
                                sessionId:
                                  type: "string"
                                journeyId:
                                  type: "string"
                                linkId:
                                  type: "string"
                                clientId:
                                  type: "string"
                                riskLevel:
                                  required:
                                    - "id"
                                    - "name"
                                    - "steps"
                                  properties:
                                    id:
                                      type: "string"
                                    name:
                                      type: "string"
                                    steps:
                                      required:
                                        - "1"
                                        - "2"
                                        - "3"
                                        - "4"
                                      properties:
                                        1:
                                          required:
                                            - "stepNo"
                                            - "checkId"
                                            - "checkName"
                                            - "checkType"
                                            - "settings"
                                          properties:
                                            stepNo:
                                              type: "number"
                                            checkId:
                                              type: "string"
                                            checkName:
                                              type: "string"
                                            checkType:
                                              type: "string"
                                            settings:
                                              required:
                                                - "allowMobile"
                                                - "allowUpload"
                                                - "crossCheckingFields"
                                                - "fastFailEnabled"
                                                - "fastFailRetryCount"
                                                - "proceedIfFastFailIsInconclusive"
                                                - "revisionId"
                                                - "supportedCountries"
                                                - "supportedDocuments"
                                              properties:
                                                allowMobile:
                                                  type: "boolean"
                                                allowUpload:
                                                  type: "boolean"
                                                crossCheckingFields:
                                                  required:
                                                    - "countryOfResidence"
                                                    - "dateOfBirth"
                                                    - "gender"
                                                    - "names"
                                                    - "nationality"
                                                  properties:
                                                    countryOfResidence:
