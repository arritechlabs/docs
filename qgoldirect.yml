openapi: 3.0.0
info:
  title: QGen Direct (Arritech's QGen Online API)
  version: "1.0.0"
  description: |
    This API enables Arritech clients to integrate their systems with QGen Online to access our services.
    It is written supporting the openAPI standards and all data returned is in JSON format. 

    Requests should be directed to the appropriate API URL 
    - Development: https://qgenonlinedev.com/integration-api/
    - Production: Contact Arritech for details

    All API requests must be made over HTTPS. HTTP is not supported! 
    See the authentication section for information on correctly authenticating calls 
    to the QGen Direct API.
    For any queries please contact: support@qgengroup.com

    # Generate API Key

    Login to qgenonline.com with a user that has credentials to generate API keys. In the **Settings** menu 
    you will find the **Generate API key** sub menu. Click on it and fill in the form.
    For security reasons, we recommend you specify the IP address of your client accessing our API. If left 
    empty, IP whitelisting is disabled, meaning that all IPs will have access to the API.

    # How to use the API explorer

    This page allows you to test the APIs directly without any coding. It's great to test some examples and
    make sure your keys are working and the servers are connected. Start by clicking the 
    **Try it out** button in the Login section. This will allow you to edit the body parameters with your
    clientID and secret Key as generated from QGen Online page.

    From the response, cut the access_token value (whatever is inside the quotations) and paste it in the 
    **value** field shown when you press the **Authorize** button shown here.

    You can then press the **Try it now** buttons on the other endpoints, edit the values of the fields in
    the *Body*  and press **Execute**

  termsOfService: "https://arritech.com"
  contact:
    name: API Dev Team
    email: support@arritech.com
    url: "https://arritech.com/contact/"
  license:
    name: Arritech Agreement
    url: "https://arritech.com"

servers:
  - url: https://qgenonlinedev.com/integration-api
    description: Development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        ## Security Scheme: JWT Bearer Token

        This API uses JWT (JSON Web Token) for authentication and authorization.

        ### Generating a Token

        After successful login through the `/v1/public/login` endpoint, a JWT token is returned in the response. This token must be included in the `Authorization` header for all other secure endpoints.

        ### Storing the Token

        **Important:** It's crucial to securely store the JWT token on the client-side to prevent unauthorized access. We recommend encrypting the token and storing it in a secure storage solution. 

        ### Transmitting the Token

        **All API requests must be made over HTTPS.** Tokens should never be transmitted over a non-secure connection.

        ### Token Expiry

        Tokens are short-lived and should be regenerated before expiry. The expiry time is included in the login response.

        ### Sample Header

        ```http
        Authorization: Bearer YOUR_JWT_TOKEN_HERE
        ```
          securitySchemes:
  schemas:
    RiskLevel:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        applyOCRDuringFastFail:
          type: boolean
          description: >
            Whether entity details are auto-filled from the document read during a fast-fail check.

    CaseType:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        group:
          type: string
        customFieldSetId:
          type: string
          nullable: true
          description: The custom field set bound to this case type, or null when none is configured.
        riskLevel:
          $ref: "#/components/schemas/RiskLevel"

    BaseEvent:
      type: "object"
      description: "Base structure for all webhook events."
      properties:
        id:
          type: "string"
          description: "Unique ID for the webhook event."
        merchantID:
          type: "string"
          description: "This is your merchant identifier. It's your unique identifier across other QGen Online Merchants and never changes"
        eventType:
          type: "string"
          description: |
            This can only be one of the events described below 
            and will indicate the structure to expect in the next field labelled 'payload'.
            Expect a string as follows e.g. 'cfm_case_created_event' or
            'cfm_entity_rejected_terms_event'
        payload:
          type: "object"
          description: "Event-specific data payload as per details described below."

    cfm_case_created_event:
      type: "object"
      properties:
        caseID:
          type: "string"
          description: "ID of the case."
        caseTypeID:
          type: "string"
          description: "Type ID of the case."
        entityID:
          type: "string"
          description: "ID of the associated entity."
        journeyID:
          type: "string"
          description: "ID of the journey associated with the case."
        locale:
          type: "string"
          description: "Language/locale setting for the case."
        merchantID:
          type: "string"
          description: "ID of the merchant involved."
        referenceID:
          type: "string"
          description: "Reference ID associated with the case."
        riskLevelID:
          type: "string"
          description: "Risk level ID assigned to the case."
        sessionID:
          type: "string"
          description: "Session ID associated with the case."

    cfm_entity_rejected_terms_event:
      type: "object"
      properties:
        caseID:
          type: "string"
          description: "ID of the case."
        caseTypeID:
          type: "string"
          description: "Type ID of the case."
        entityID:
          type: "string"
          description: "ID of the associated entity."
        journeyID:
          type: "string"
          description: "ID of the journey associated with the case."
        locale:
          type: "string"
          description: "Language/locale setting for the case."
        merchantID:
          type: "string"
          description: "ID of the merchant involved."
        referenceID:
          type: "string"
          description: "Reference ID associated with the case."
        riskLevelID:
          type: "string"
          description: "Risk level ID assigned to the case."
        sessionID:
          type: "string"
          description: "Session ID associated with the case."

    cfm_user_geo_blocked_event:
      type: "object"
      properties:
        merchantID:
          type: "string"
          description: "ID of the merchant involved."
        referenceID:
          type: "string"
          description: "Reference ID associated with the event."
        riskLevelID:
          type: "string"
          description: "Risk level ID assigned to the event."
        journeyID:
          type: "string"
          description: "ID of the journey associated with the case."
        IPAddress:
          type: "string"
          description: "IP address involved in the event."
        IPDetails:
          type: "object"
          properties:
            ip:
              type: "string"
              description: "IP address string."
            continentcode:
              type: "string"
              description: "Continent code derived from IP."
            continentname:
              type: "string"
              description: "Continent name derived from IP."
            countrycode:
              type: "string"
              description: "Country code derived from IP."
            countryname:
              type: "string"
              description: "Country name derived from IP."
            regioncode:
              type: "string"
              description: "Region code derived from IP."
            city:
              type: "string"
              description: "City derived from IP."
            sessionID:
              type: "string"
              description: "Session ID associated with the event."

    cfm_journey_completed_event:
      type: "object"
      properties:
        acceptanceInfo:
          type: "object"
          description: "Details of acceptance information."
          properties:
            deviceIP:
              type: "string"
              description: "IP address of the device."
            deviceInfo:
              type: "string"
              description: "Information about the device and browser used."
            id:
              type: "string"
              description: "ID of the acceptance event."
            timestamp:
              type: "string"
              format: "date-time"
              description: "Timestamp of the journey start."
            version:
              type: "string"
              description: "Version of the Terms and Conditions"
        caseID:
          type: "string"
          description: "ID of the case."
        caseTypeID:
          type: "string"
          description: "Type ID of the case."
        entityID:
          type: "string"
          description: "ID of the associated entity."
        journeyID:
          type: "string"
          description: "ID of the journey associated with the case."
        locale:
          type: "string"
          description: "Language setting for the case if selected by the user. EN is default"
        merchantID:
          type: "string"
          description: "This is your merchant identifier. It's your unique identifier across other QGen Online Merchants and never changes."
        referenceID:
          type: "string"
          description: "Reference ID associated with the case. You should send this. Make sure it is unique."
        riskLevelID:
          type: "string"
          description: "Risk level ID assigned to the case."
        sessionID:
          type: "string"
          description: "Session ID associated with the case. A session has a time-out."
        steps:
          type: "array"
          description: "List of steps in the journey as defined in the Risk settings."
          items:
            type: "object"
            properties:
              checkName:
                type: "string"
                description: "Name of the check step."
              checkType:
                type: "string"
                description: "Type of the check step. e.g. Identity Documents"
              completed:
                type: "boolean"
                description: "Truq if the step has been completed. False otherwise."
              completedAt:
                type: "string"
                format: "date-time"
                description: "Time when the step was completed."
              data:
                type: "object"
                properties:
                  candidate:
                    type: "object"
                    properties:
                      documentCountryCode:
                        type: "string"
                        description: "Country code of the document. e.g. MT"
                      documentCountryName:
                        type: "string"
                        description: "Country name of the document. e.g. Malta"
                      documentDescription:
                        type: "string"
                        description: "Description of the document. e.g. Identity Card"
                      documentName:
                        type: "string"
                        description: "Name of the document."
                      documentTypeDetail:
                        type: "string"
                        description: "Type detail of the document."
                      probability:
                        type: "number"
                        description: "Probability of the document that it's what we indicate it to be."
                  documentType:
                    type: "string"
                    description: "Type of the document."
                  documents:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        fileName:
                          type: "string"
                          description: "Name of the file associated with the document."
                        isUpload:
                          type: "boolean"
                          description: "True if the document was uploaded."
                        side:
                          type: "string"
                          description: "Side of the document. Front or Back"
                        size:
                          type: "integer"
                          description: "Size of the document file in bytes."
                  documentsSize:
                    type: "integer"
                    description: "Total size of all documents in bytes."
                  fastFail:
                    type: "boolean"
                    description: "Whether the step had fast fail logic implemented."
                  numberOfDocuments:
                    type: "integer"
                    description: "Number of documents involved in the step."
              deviceIP:
                type: "string"
                description: "IP address of the device used in the step."
              deviceInfo:
                type: "string"
                description: "Information about the device and browser used."
              documents:
                type: "array"
                description: >
                  One entry per grouped document produced by the step. `id` is the grouped document id — for
                  AML Screening steps that is the AML grouped document, not the certificate — and `documents[]`
                  are its files. The AML certificate is `documents[0].documents[0]`, with `documentType`
                  "AML Screening"; it is absent when no certificate was produced.
                items:
                  type: "object"
                  properties:
                    id:
                      type: "string"
                      description: "The grouped document id."
                    documents:
                      type: "array"
                      items:
                        type: "object"
                        properties:
                          id:
                            type: "string"
                            description: "File id. Use this with GET /v1/case/case/{caseId}/{docId}."
                          key:
                            type: "string"
                          fileName:
                            type: "string"
                          documentType:
                            type: "string"
                          documentSide:
                            type: "string"
                          mimeType:
                            type: "string"
                          extension:
                            type: "string"
                          size:
                            type: "number"
              faceLiveness:
                type: "object"
                properties:
                  UUID:
                    type: "string"
                    description: "UUID of the face liveness check."
                  completed:
                    type: "boolean"
                    description: "Whether the face liveness check is completed."
                  createdBy:
                    type: "object"
                    properties:
                      actorId:
                        type: "string"
                        description: "ID of the actor initiating the face liveness check."
                      actorType:
                        type: "string"
                        description: "Type of the actor initiating the face liveness check."
                      timestamp:
                        type: "string"
                        format: "date-time"
                        description: "Timestamp of the actor's action."
                  response:
                    type: "object"
                    properties:
                      capture_liveness:
                        type: "object"
                        properties:
                          probability:
                            type: "number"
                            description: "Probability score for the capture liveness."
                          score:
                            type: "number"
                            description: "Score for the capture liveness."
                      face_liveness:
                        type: "object"
                        properties:
                          probability:
                            type: "number"
                            description: "Probability score for the face liveness."
                  revisionID:
                    type: "integer"

                    description: "Revision ID of the face liveness response."
              stepNo:
                type: "integer"
                description: "Step number in the journey sequence."
    cfm_kyc_completed_event:
      description: >
        Full schema of KYC completed event. [See example here](https://arritechlabs.github.io/docs/examples/cfm_kyc_completed_event.json)


        Each step under `payload.steps` carries a `documents[]` array of `{id, documents[]}`. `id` is the step's
        grouped document id; the files sit one level down. For AML Screening steps the certificate is
        `documents[0].documents[0]`, with `documentType` "AML Screening" — `documents[0].id` is the grouped document
        and is not a downloadable file id. Events emitted before AML gained a grouped document carry the
        certificate's own document id in `documents[0].id` and an empty `documentType` on the file.
      type: "object"
      properties:
        base:
          type: "object"
          description: "Base event information common to all events."
          properties:
            merchantID:
              type: "string"
              description: "Your merchant identifier."
            referenceID:
              type: "string"
              description: "Unique reference ID for the event."
            sessionID:
              type: "string"
              description: "Session ID associated with the event."
            riskLevelID:
              type: "string"
              description: "Risk level ID assigned to the event."
            journeyID:
              type: "string"
              description: "Journey ID associated with the event."
            caseID:
              type: "string"
              description: "Case ID associated with the event."
            entityID:
              type: "string"
              description: "Entity ID related to the event."
            caseTypeID:
              type: "string"
              description: "Type ID of the case."
              nullable: true
            locale:
              type: "string"
              description: "Language setting for the case."
            webhooks:
              type: "array"
              description: "List of webhook configurations."
              items:
                type: "object"
                properties:
                  id:
                    type: "string"
                    description: "Unique ID of the webhook."
                  endpoint:
                    type: "string"
                    description: "Endpoint URL for the webhook."
                  retryCount:
                    type: "integer"
                    description: "Number of retries attempted for the webhook."
                  secretKey:
                    type: "string"
                    description: "Secret key for securing the webhook."
        payload:
          type: "object"
          description: "Details of the KYC completed event payload."
          properties:
            merchantId:
              type: "string"
              description: "Your merchant identifier."
            referenceId:
              type: "string"
              description: "Unique reference ID for the KYC."
            caseId:
              type: "string"
              description: "Case ID associated with the KYC."
            caseTypeId:
              type: "string"
              description: "Case type ID."
              nullable: true
            entityId:
              type: "string"
              description: "Entity ID related to the KYC."
            sessionId:
              type: "string"
              description: "Session ID associated with the KYC."
            journeyId:
              type: "string"
              description: "Journey ID associated with the KYC."
            clientId:
              type: "string"
              description: "Client ID related to the KYC."
            linkId:
              type: "string"
              description: "Link ID associated with the KYC."
            messageId:
              type: "string"
              description: "Optional message ID."
              nullable: true
            riskLevel:
              type: "string"
              description: "Risk level information."
            ipInfo:
              type: "object"
              description: "Details of the client's IP information."
              properties:
                IPAddress:
                  type: "string"
                  description: "IP address of the client."
                IPCountry:
                  type: "string"
                  description: "Country of the IP address."
                agentInfo:
                  type: "object"
                  description: "Information about the client's device and browser."
                  properties:
                    browser:
                      type: "string"
                      description: "Browser used by the client."
                    operatingSystem:
                      type: "string"
                      description: "Operating system of the client's device."
                    device:
                      type: "string"
                      description: "Device used by the client."
                    deviceType:
                      type: "string"
                      description: "Type of the client's device (e.g., Mobile, Desktop)."
            steps:
              type: "object"
              description: "Mapping of steps in the KYC process."
              additionalProperties:
                type: "object"
                description: "Details of a specific step."
            terminationState:
              type: "string"
              description: "Termination state of the session."
              nullable: true
            terminationNotes:
              type: "string"
              description: "Notes about the termination state."
              nullable: true
            startedAt:
              type: "string"
              format: "date-time"
              description: "Timestamp of when the KYC process started."
            completedAt:
              type: "string"
              format: "date-time"
              description: "Timestamp of when the KYC process completed."
              nullable: true
            expiresAt:
              type: "string"
              format: "date-time"
              description: "Timestamp of when the session expires."
              nullable: true
            duration:
              type: "number"
              format: "float"
              description: "Duration of the KYC process in seconds."
              nullable: true
            completed:
              type: "boolean"
              description: "Whether the KYC process is completed."
            decision:
              type: "object"
              description: "Decision details for the KYC."
              properties:
                status:
                  type: "string"
                  description: "Status of the decision (e.g., Approved, Rejected)."
                notes:
                  type: "array"
                  description: "Additional notes regarding the decision."
                  items:
                    type: "string"
                timestamp:
                  type: "string"
                  format: "date-time"
                  description: "Timestamp of when the decision was made."
            cloned:
              type: "boolean"
              description: "Indicates whether the session was cloned."
              nullable: true
            previousSessionId:
              type: "string"
              description: "ID of the previous session, if any."
              nullable: true

tags:
  - name: authentication
  - name: aml

paths:
  /v1/public/login:
    post:
      tags:
        - authentication
      summary: login
      description: |
        You should have already generated an access key pair via QGen Online Dev tools section.
        If not, Login to QGen Online using your admin user credentials, and access the Dev tools 
        to generate an API key. You can generate multiple keys for both
        the development or production environments. Multiple keys are uniquely
        identified by a unique key identifier called ClientID.
        This 'Login' endpoint converts your clientID/secretkey pair, if validated, into
        a JWT session token to use during your other API calls. You can call this more than one 
        time during a session to make sure it does not expire. So check the expiry time 
        provided with the token in the response and make sure to generate a new token before the time is up. 
        Parameters required:
        - clientID
        - apikey
      security: []
      requestBody:
        description: Send the clientID and respective secret API key as generated in QGenOnline
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId:
                  type: string
                  description: ClientID that matches the secret key
                clientSecret:
                  type: string
                  description: Secret key
              required:
                - clientId
                - clientSecret

              example:
                clientId: client_unique_id
                clientSecret: client_secret
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: True if the token was generated successfully. False otherwise
                  data:
                    type: object
                    description: In case of an error, this object will be set to 'null'
                    properties:
                      accessToken:
                        type: string
                        description: The temporary JWT token to use in all subsequent calls
                      expires:
                        type: string
                        format: date-time
                        description: expiry date and time of the token
                  errors:
                    type: array
                    nullable: true
                    description: Array of error object types. If the request was successful, this object will be set to 'null'
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          description: The HTML error reason code. Includes 400 (bad request), 401 (Unauthorized)
                        message:
                          type: string
                          description: A descriptive message describing the reason for the error
              example:
                success: true
                data:
                  accessToken: |
                    eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9.eyJjbGFpbXMiOlsiQ29tcGx5IiwiQU1MIl0sImNsaWVudF9pZCI6IjYzZjM4NWI2OTQwY2JmYzYx
                    ZjYxM2Q1NCIsImV4cCI6MTY3NjkxNDg2NywiaXNzIjoiUWdlbkFwaSIsIm1lcmNoYW50X2lkIjoiNWVkZTE3OTUxMTExZmMyNGQ4OWJiYTdiIiwibW
                    VyY2hhbnRfbmFtZSI6Iktub3cgTWUgTm93Iiwib3JpZ19pYXQiOjE2NzY5MDc2NjcsInVzZXJuYW1lIjoiZ29kd2luLnNjaGVt
                    YnJpQGtub3dtZW5vdy5jb20ifQ.ozzW9BCFPicR93t_zOJTwn3vaHc8-ibiQbYqZVlPi7AoUw9skC0QL6dgxkVqQGxQ2on8arR_NiaaIR8JxelcGS
                  expires: 2023-02-20T17:41:07.725270578Z
                errors: null

        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: False in case of a bad request
                  data:
                    type: object
                    description: In case of an error, this object will be set to 'null'
                  errors:
                    type: array
                    nullable: true
                    description: Array of error object types.
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          description: Bad request error
                        message:
                          type: string
                          description: A descriptive message describing the reason for the error
              example:
                success: false
                data: null
                errors:
                  - code: 400
                    message: "invalid character '\\n' in string literal"

        "401":
          description: Unauthorized, check your token if still valid. It may have expired.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: False in case of a bad request
                  data:
                    type: object
                    description: In case of an error, this object will be set to 'null'
                  errors:
                    type: array
                    nullable: true
                    description: Array of error object types.
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          description: Bad request error
                        message:
                          type: string
                          description: A descriptive message describing the reason for the error
              example:
                success: false
                data: null
                errors:
                  - code: 401
                    message: "invalid token secret"

  /v1/aml/search:
    post:
      tags:
        - aml
      summary: Search
      description: |
        Creates a new search by sending search terms, parameters and filters. This endpoint can be used to 
        instantly know if the entity has any potential hits. If there are no hits, the endpoint returns 'No Match' 
        and a 0 value in the totalHits. This allows you to instantly onboard a customer. If this search
        return 'potential match' plus a value which is higher than 1 in the totalHits field, you can suspend the 
        onboarding process until you review the hits on qgenonline.com using the returned ID to filter 
        the results. To enable monitoring isMonitored boolean flag should be set explicitly.
        Supply `caseId` and `entityId` together to link the search to an entity on a case in the same call; the
        search is created either way, and the link makes it reviewable on the case.
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                searchTerm:
                  type: string
                  description: The name of the entity. Can be a person or a company
                filters:
                  type: object
                  properties:
                    entityType:
                      type: string
                      description: The type of entity to search for. Can be one of [person, company, vessel, aircraft, organization]
                    birthYear:
                      type: string
                      description: >
                        The year of birth of the person if known, as a 4-digit string between 1900 and the current
                        year. Leave empty if the entity is a company.
                    countryCodes:
                      description: |
                        Results are filtered by the entity nationality or 
                        country of residence. An array of ISO 3166-1 alpha-2 strings
                      type: array
                      items:
                        type: string
                    types:
                      description: |
                        These types are used within the search to refine 
                        the result set. There is an extensive range of 
                        filters available - use of the filters is entirely 
                        optional. The example shows how the filters should 
                        be included in your request. You must send a value
                        from the allowed list as documented here.
                      type: array
                      items:
                        type: string
                        enum:
                          - sanction
                          - warning
                          - fitness-probity
                          - pep
                          - pep-class-1
                          - pep-class-2
                          - pep-class-3
                          - pep-class-4
                          - adverse-media
                          - adverse-media-financial-crime
                          - adverse-media-violent-crime
                          - adverse-media-sexual-crime
                          - adverse-media-terrorism
                          - adverse-media-fraud
                          - adverse-media-narcotics
                          - adverse-media-general
                          - adverse-media-v2-property
                          - adverse-media-v2-financial-aml-cft
                          - adverse-media-v2-fraud-linked
                          - adverse-media-v2-narcotics-aml-cft
                          - adverse-media-v2-violence-aml-cft
                          - adverse-media-v2-terrorism
                          - adverse-media-v2-cybercrime
                          - adverse-media-v2-general-aml-cft
                          - adverse-media-v2-regulatory
                          - adverse-media-v2-financial-difficulty
                          - adverse-media-v2-violence-non-aml-cft
                          - adverse-media-v2-other-financial
                          - adverse-media-v2-other-serious
                          - adverse-media-v2-other-minor
                clientRef:
                  type: string
                  description: Your reference for easy link to your records
                  maxLength: 255
                notes:
                  type: string
                  description: |
                    Your own notes to add to this search for future reference. Max length is 1024 characters.
                fuzziness:
                  description: |
                    Determines how closely the returned results must match 
                    the supplied name. Overridden by exact_match parameter
                    setting in this request
                  type: number
                  format: float
                  minimum: 0.0
                  maximum: 1.0
                tags:
                  description: |
                    An array of three custom tags labelled Tag1, Tag2 and Tag 3, Just insert whatever 
                    the value you want in that sequence to assign the first value to tag 1, the second value 
                    to tag 3 and \the third value in the list to tag 3, Any or all tags  can be left empty
                  type: array
                  items:
                    type: string
                isMonitored:
                  type: boolean
                  description: >
                    Flag to enable monitoring of the search. Defaults to `false`, so a search is not monitored
                    unless you ask for it.
                caseId:
                  type: string
                  description: >
                    Optional. Supply together with `entityId` to link the resulting search to an entity on a case,
                    exactly as `POST /v1/case/cases/{caseid}/{entityid}/{complyid}/link` would. Must be a valid
                    ObjectId, and the case must contain the entity. Supplying one of the pair without the other is
                    rejected.
                entityId:
                  type: string
                  description: >
                    Optional. The Person or Company on the case to link the search to. Requires `caseId`. Because
                    linking writes to the case module, this variant additionally requires the **case:operator**
                    role on top of **aml:operator**, and is refused without it before the (billable) search runs.

              example:
                searchTerm: Jesse Pinkman
                filters:
                  entityType: person
                  birthYear: "1980"
                  countryCodes:
                    - US
                    - CA
                  types:
                    - sanction
                    - warning
                    - fitness-probity
                    - pep
                    - pep-class-1
                    - pep-class-2
                    - pep-class-3
                    - pep-class-4
                    - adverse-media
                    - adverse-media-financial-crime
                    - adverse-media-violent-crime
                    - adverse-media-sexual-crime
                    - adverse-media-terrorism
                    - adverse-media-fraud
                    - adverse-media-narcotics
                    - adverse-media-general
                clientRef: "1234567890"
                notes: This is an optional note for your records.
                fuzziness: 0.6
                tags:
                  - String to assign to Tag 1
                  - String to assign to Tag 2
                  - String to assign to Tag 3
                isMonitored: false

      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: True if the token was generated successfully. False otherwise
                  data:
                    type: object
                    description: In case of an error, this object will be set to 'null'
                    properties:
                      id:
                        type: string
                        description: The unique search ID is generated automatically
                      totalHits:
                        type: integer
                        description: total number of hits
                      matchStatus:
                        type: string
                        description: Set to "potential_match" if totalHits value is more than 0. set to "No_Match" if totalHits is 0
                  errors:
                    type: array
                    nullable: true
                    description: Array of error object types. If the request was successful, this object will be set to 'null'
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          description: The HTML error reason code. Includes 400 (bad request), 401 (Unauthorized)
                        message:
                          type: string
                          description: A descriptive message describing the reason for the error
              example:
                success: true
                data:
                  id: unique_id
                  totalHits: 9
                  matchStatus: potential_match
                errors: null

        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Set to false if not successful
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: The unique search ID is generated automatically
                      totalHits:
                        type: integer
                        description: total number of hits
                      matchStatus:
                        type: string
                        description: Set to "potential_match" if totalHits value is more than 0. Set to "No_Match" if totalHits is 0
                  errors:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          description: Http error code
                        message:
                          type: string
                          description: error message
              example:
                success: false
                data: null
                errors:
                  - code: 400
                    message: unknown field search term

        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Set to false if not successful
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: The unique search ID is generated automatically
                      totalHits:
                        type: integer
                        description: total number of hits
                      matchStatus:
                        type: string
                        description: Set to "potential_match" if totalHits value is more than 0. Set to "No_Match" if totalHits is 0
                  errors:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          description: Http error code
                        message:
                          type: string
                          description: error message
              example:
                success: false
                data: null
                errors:
                  - code: 401
                    message: unauthorized

  /v1/aml/search/{id}:
    post:
      tags:
        - aml
      summary: Get Search by ID
      description: |
        Retrieves details of a previously performed search using its unique ID. This endpoint allows you to 
        access search results that were previously created through the search endpoint. You can use this 
        endpoint to review potential matches that were identified during the initial search process.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The unique search ID that was previously generated when the search was created
          example: unique_id
      responses:
        "200":
          description: |
            Successful response containing the stored search, its result and the live AML assessment.
            The search must have completed; a search still `Pending` (for example because the
            ComplyAdvantage call failed) returns an error rather than a partial payload.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      search:
                        type: object
                        description: The stored search, as submitted and as it stands now.
                        properties:
                          id:
                            type: string
                            description: The search ID. The same value you passed in the path.
                          searchTerm:
                            type: string
                          fuzziness:
                            type: number
                            format: float
                          entityType:
                            type: string
                          birthYear:
                            type: string
                          countryCodes:
                            type: array
                            items:
                              type: string
                          types:
                            type: array
                            description: The ComplyAdvantage list types the search was run against.
                            items:
                              type: string
                          totalHits:
                            type: integer
                            description: >
                              The hit count ComplyAdvantage reported when the search ran. It is a snapshot and does
                              not move as hits are whitelisted or removed afterwards — use `liveTotalHits` for the
                              current count.
                          matchTypeHits:
                            type: array
                            items:
                              type: string
                          tags:
                            type: array
                            items:
                              type: string
                          clientReference:
                            type: string
                            nullable: true
                          isMonitored:
                            type: boolean
                          hasUpdate:
                            type: boolean
                            description: True when a monitored search has updates that have not been reviewed.
                          status:
                            type: string
                            description: >
                              The raw stored status. Prefer `amlStatus`, which normalises legacy spellings onto the
                              defined set.
                          internalStatus:
                            type: string
                            description: Processing state of the search, e.g. `Completed` or `Pending`.
                          complyId:
                            type: integer
                          searchResultId:
                            type: string
                            nullable: true
                          audit:
                            type: object
                      result:
                        type: object
                        description: >
                          The stored ComplyAdvantage result for the search. `complyResult` is the provider payload
                          passed through unchanged; individual hits are not included here — page them with
                          `POST /v1/aml/search/hits/paginate`.
                        properties:
                          id:
                            type: string
                          complySearchId:
                            type: string
                          complyAdvantageId:
                            type: integer
                          complyResult:
                            type: object
                            additionalProperties: true
                      updates:
                        type: object
                        description: Monitoring updates recorded against the search since it was last reviewed.
                        properties:
                          added:
                            type: array
                            items:
                              type: string
                          updated:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                name:
                                  type: string
                          deleted:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                name:
                                  type: string
                      amlStatus:
                        type: string
                        enum: [Not set, All clear, Possible hit, Positive hit]
                        description: >
                          The compliance verdict recorded on this search, returned as stored and normalised onto this
                          set. It is never derived from the hits: `Not set` means no operator has adjudicated the
                          search, whatever `hitStats` reports, so treat it as the decision itself rather than as a
                          summary of what was found.
                      categories:
                        type: array
                        description: >
                          Per searchable ComplyAdvantage group, how many of its list types the search covered. A group
                          that was not searched is still returned, with `covered` set to 0.
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                              enum: [sanctions, peps, adverse-media-v2]
                              description: Stable group key. Match on this rather than on `label`.
                            label:
                              type: string
                              description: The ComplyAdvantage catalogue name for the group. Display text may change.
                            covered:
                              type: integer
                            total:
                              type: integer
                      liveTotalHits:
                        type: integer
                        nullable: true
                        description: >
                          The current number of hits stored for the search. Omitted when the live count could not be
                          read; it is deliberately not filled in from `search.totalHits`, which is a snapshot.
                      hitStats:
                        type: object
                        nullable: true
                        description: >
                          The live breakdown of the search's hits — what was found, which is a separate question from
                          `amlStatus`, the decision taken about it. Omitted when unavailable.
                        properties:
                          totalHits:
                            type: integer
                          nonWhitelistedCount:
                            type: integer
                            description: Hits that have not been whitelisted.
                          exactNonWhitelistedCount:
                            type: integer
                            description: Outstanding hits that are exact matches.
                  errors:
                    type: array
                    nullable: true
                    items:
                      type: object
              example:
                success: true
                data:
                  search:
                    id: unique_id
                    searchTerm: Jesse Pinkman
                    fuzziness: 0.6
                    entityType: person
                    birthYear: "1980"
                    countryCodes: [US, CA]
                    types: [sanction, warning, fitness-probity, pep]
                    totalHits: 9
                    isMonitored: false
                    hasUpdate: false
                    status: Not set
                    internalStatus: Completed
                  result:
                    id: unique_id
                    complySearchId: unique_id
                    complyAdvantageId: 1234567890
                    complyResult: {}
                  updates:
                    added: []
                    updated: []
                    deleted: []
                  amlStatus: Possible hit
                  categories:
                    - key: sanctions
                      label: Sanctions, Warnings and Fitness And Probity
                      covered: 3
                      total: 3
                    - key: peps
                      label: PEPs
                      covered: 1
                      total: 5
                    - key: adverse-media-v2
                      label: All Adverse Media V2
                      covered: 0
                      total: 14
                  liveTotalHits: 9
                  hitStats:
                    totalHits: 9
                    nonWhitelistedCount: 4
                    exactNonWhitelistedCount: 0
                errors: null

        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Set to false if not successful
                  data:
                    type: object
                    description: This will be null when there's an error
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          description: Error code
                        message:
                          type: string
                          description: error message

              example:
                success: false
                data: null
                errors:
                  - code: 400
                    message: invalid search ID format
    delete:
      tags:
        - aml
      summary: Delete a Search
      description: |
        Deletes a previously performed search using its unique ID. For auditing purposes, the `x-action-name` header should be included with a value like 'Delete a Search'.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The unique search ID that was previously generated when the search was created.
          example: unique_id
        - in: header
          name: x-action-name
          required: false
          schema:
            type: string
            default: 'Delete a Search'
          description: Action name for audit purposes.
      responses:
        "200":
          description: Search successfully deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                  errors:
                    type: array
                    nullable: true
                    items:
                      type: object
              example:
                success: true
                data: null
                errors: null
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                  errors:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
              example:
                success: false
                data: null
                errors:
                  - code: 400
                    message: "unable to delete AML search"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                  errors:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
              example:
                success: false
                data: null
                errors:
                  - code: 401
                    message: "unauthorized"

  /v1/aml/search/hits/paginate:
    post:
      tags:
        - aml
      summary: Paginate AML Hits
      description: |
        Retrieves paginated hits for a specific search. This endpoint allows you to 
        fetch hits in smaller chunks, enabling more efficient data retrieval and display.
        You can specify which page of results to retrieve and how many results per page.
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                searchId:
                  type: string
                  description: >
                    The AML search ID — the `id` returned by `POST /v1/aml/search` — whose hits to page through.
                page:
                  type: integer
                  description: The page number to retrieve (zero-based). Defaults to 0 when omitted.
                perPage:
                  type: integer
                  description: >
                    The number of hits per page. Omitting it, or sending 0, returns every hit for the search.
              required:
                - searchId
              example:
                searchId: 60f1b5b3e6b1f2c8a4d7e8f9
                page: 0
                perPage: 10
      responses:
        "200":
          description: |
            Successful response containing the paginated hits for the requested search.
            Returns a list of hits based on the specified page and perPage parameters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: True if the hits were retrieved successfully. False otherwise
                  data:
                    type: object
                    properties:
                      hits:
                        type: array
                        description: >
                          The requested page of hits. Each entry is the ComplyAdvantage hit payload passed through
                          unchanged, plus `detectionDate` when the hit was picked up by monitoring rather than by
                          the original search.
                        items:
                          type: object
                          additionalProperties: true
                  errors:
                    type: array
                    nullable: true
                    description: Will be null when the request is successful
                    items:
                      type: object

        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Set to false if not successful
                  data:
                    type: object
                    description: This will be null when there's an error
                  errors:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          description: Http error code
                        message:
                          type: string
                          description: error message
              example:
                success: false
                data: null
                errors:
                  - code: 400
                    message: invalid search ID format

        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Set to false if not successful
                  data:
                    type: object
                    description: This will be null when there's an error
                  errors:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          description: Http error code
                        message:
                          type: string
                          description: error message
              example:
                success: false
                data: null
                errors:
                  - code: 401
                    message: unauthorized

  /v1/cfm/session/continue:
    post:
      tags:
        - cfm
      summary: Continue a session
      description: |
        Creates a new session for the provided `sessionId`. Depending on the `withMessage` parameter:

        - If `withMessage` is set to `true`, the system creates a new session and sends the session link to the end user via email or SMS (email has priority if both are available). The end user uses the link to resume their session.
        - If `withMessage` is set to `false`, the system creates a new session but does not send any notifications. You can use the response to embed the session link directly.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: string
                  description: The unique session ID.
                withMessage:
                  type: boolean
                  description: |
                    Determines whether a notification should be sent to the end user. 
                    - `true`: Sends email or SMS with the session link.
                    - `false`: Does not send notifications.
              required:
                - sessionId
                - withMessage
              example:
                sessionId: "unique-session-id"
                withMessage: false
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates whether the operation was successful.
                  data:
                    type: object
                    description: The details of the session and its status.
                    properties:
                      caseId:
                        type: string
                        description: The unique case ID associated with the session.
                      entityId:
                        type: string
                        description: The unique entity ID.
                      journeyId:
                        type: string
                        description: The unique journey ID.
                      sessionId:
                        type: string
                        description: The unique session ID.
                      withMessage:
                        type: boolean
                        description: Indicates whether a message was sent to the end user.
                      cfmUrl:
                        type: string
                        nullable: true
                        description: The URL for the session, provided when `withMessage` is `false`.
                      messageType:
                        type: string
                        nullable: true
                        description: The type of message sent (e.g., "Email"), provided when `withMessage` is `true`.
                      message:
                        type: string
                        nullable: true
                        description: A detailed message about the session status or action taken.
                  errors:
                    type: array
                    nullable: true
                    description: Contains error details if the operation failed.
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          description: The HTTP status code.
                        message:
                          type: string
                          description: A description of the error.
              examples:
                withMessageTrue:
                  summary: Response when withMessage is true
                  value:
                    success: true
                    data:
                      caseId: "uniqueId"
                      entityId: "uniqueId"
                      journeyId: "uniqueId"
                      sessionId: "uniqueId"
                      withMessage: true
                      cfmUrl: null
                      messageType: "Email"
                      message: "The previous session has been expired but is not completed. New link has been sent via email. End user should check their inbox to continue the session where they left."
                    errors: null
                withMessageFalse:
                  summary: Response when withMessage is false
                  value:
                    success: true
                    data:
                      caseId: "uniqueId"
                      entityId: "uniqueId"
                      journeyId: "uniqueId"
                      sessionId: "uniqueId"
                      withMessage: false
                      cfmUrl: "http://localhost:8082/cfm/?session_id=6728ce0872d7b6937043e5a6"
                      messageType: null
                      message: null
                    errors: null
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Always set to `false` for errors.
                  errors:
                    type: array
                    nullable: true
                    description: Contains error details.
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          description: HTTP status code.
                        message:
                          type: string
                          description: A description of the error.
              example:
                success: false
                errors:
                  - code: 400
                    message: "Invalid session ID provided."
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Always set to `false` for errors.
                  errors:
                    type: array
                    nullable: true
                    description: Contains error details.
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          description: HTTP status code.
                        message:
                          type: string
                          description: A description of the error.
              example:
                success: false
                errors:
                  - code: 401
                    message: "Unauthorized. Please check your credentials."

  /v1/aml/search/monitor:
    post:
      tags:
        - aml
      summary: Monitor
      description: |
        Switch 'ON' or 'OFF' the monitoring on a specific search. Searches are not
        monitored unless asked for, either by setting `isMonitored` on the search
        request or by calling this endpoint afterwards.
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: The search ID returned in the ID field of the response to a Search call
                isMonitored:
                  type: boolean
                  description: Set to 'true' if you want to monitor this search. Set to 'false' if you want to stop monitoring
              example:
                id: unique_id
                isMonitored: false

      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: true if successful, false if unsuccessful
                  data:
                    type: object
                    nullable: true
                    description: Always null; the call returns no payload.
                  errors:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
              example:
                success: true
                data: null
                errors: null

        "400":
          description: Invalid ID - ID does not exist
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: true if successful, false if unsuccessful
                  data:
                    type: object
                    nullable: true
                    description: Always null; the call returns no payload.
                  errors:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
              examples:
                invalidIdExample:
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 400
                        message: id - Value must be a valid bson object ID
                notFoundExample:
                  summary: The search does not exist. Reported as a 400 with error code 1011, not a 404.
                  value:
                    success: false
                    data: null
                    errors:
                      - code: 1011
                        message: unable to set monitor

        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Set to false if not successful
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: The unique search ID is generated automatically
                      totalHits:
                        type: integer
                        description: total number of hits
                      matchStatus:
                        type: string
                        description: Set to "potential_match" if totalHits value is more than 0. set to "No_Match" if totalHits is 0
                  errors:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          description: Http error code
                        message:
                          type: string
                          description: error message
              example:
                success: false
                data: null
                errors:
                  - code: 401
                    message: unauthorized

  /v1/cfm/case/init:
    post:
      tags:
        - cfm
      summary: Initiate a new case via the CFM.
      description: |
        Designed to initiate a customer onboarding session via our CFM component. Make the call from your onboarding webpage after collecting basic personal details
        from an applicant. To make the call you will need to first get a valid caseTypeId which you can retrieve via the `/v1/cfm/case/types` endpoint. You may
        ask our applicant to select a product or service linked to the case type created in QGoL or assume it automatically based on the link the applicant used.
        A successful request will create a new Case Summary containing the Personal Entity with the personal details you submitted. We will return the `CaseId`, the `entityId`
        and especially a URL link where the session with the requested CFM flow is hosted.

        Person entities remain the default: existing integrations that omit `entityType` continue to work unchanged. To onboard a Company instead, set
        `entityType: "company"` and provide a `company` block (only `company.name` is required; all other company fields are optional).
        The response echoes `entityType` so you can tell which kind of entity a session belongs to.

        `referenceId` is always required, and at least one of `email` or `mobile` must be supplied — when `email`
        is omitted, `mobile` is mandatory. For a Person the name fields are optional but `firstName` and `lastName`
        together must not exceed 255 characters, since they form the AML search term; for a Company, `company.name`
        is required instead.
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                entityType:
                  type: string
                  enum: [person, company]
                  description: Kind of entity the session is opened against. Defaults to `person` when omitted.
                  example: "person"
                company:
                  type: object
                  description: Company details. Required when `entityType` is `company`. Only `name` is required; other fields are optional.
                  properties:
                    name:
                      type: string
                      description: Registered legal name of the company. Required when `entityType` is `company`.
                      example: "Acme Widgets Ltd"
                    tradeName:
                      type: string
                      description: Trading name if different from the registered name.
                    regNum:
                      type: string
                      description: Company registration number.
                    regDate:
                      type: string
                      format: date
                      description: Company registration date in `YYYY-MM-DD` format.
                    regCountry:
                      type: string
                      description: Country of registration, ISO 3166-1 alpha-2.
                    businessType:
                      type: string
                      description: Free-text business type / industry.
                    companyType:
                      type: string
                      description: Legal company type (e.g. Ltd, LLC).
                    vatNum:
                      type: string
                      description: VAT registration number.
                    repName:
                      type: string
                      description: Company representative's name.
                    repEmailAddress:
                      type: string
                      format: email
                      description: Company representative's email.
                    repPhoneNum:
                      type: string
                      description: Company representative's phone number.
                    compEmailAddress:
                      type: string
                      format: email
                      description: Company contact email.
                    compPhoneNum:
                      type: string
                      description: Company contact phone number.
                    compStatus:
                      type: string
                      description: Company operational status.
                caseTypeId:
                  type: string
                  description: A valid value as returned from the `/v1/cfm/case/types` endpoint. Case Types are created in QGen Online via the UI.
                  example: "unique_id"
                riskLevelId:
                  type: string
                  description: >
                    Optional. The risk level to run the session against, overriding the one configured for the case
                    type. Retrieve valid values from the `riskLevel` returned by `/v1/cfm/case/types`.
                  example: "unique_id"
                referenceId:
                  type: string
                  description: A unique reference to your applicant. Make sure this was never submitted before and does not already exist in QGoL.
                  example: "testreference3"
                description:
                  type: string
                  description: Free text you can submit with the application. Will be visible in the notes field in the Case Summary.
                  example: "This is the description field"
                email:
                  type: string
                  format: email
                  description: Applicant email. We validate this and can reject a request if this is not a valid email structure. At least one of email or mobile is required.
                  example: "bobsmith@example.com"
                mobile:
                  type: string
                  pattern: '^\+[1-9]\d{1,14}$'
                  description: Applicant valid mobile number with country code.
                  example: "+35679000000"
                title:
                  type: string
                  enum: [Mr, Mrs, Miss, Ms, Dr, Prof, Mx]
                  description: The title before an applicant's name, limited to the specified prefixes.
                  example: "Mr"
                firstName:
                  type: string
                  description: Applicant's first name. Required.
                  example: "Abraham"
                lastName:
                  type: string
                  description: Applicant's last name. Required.
                  example: "Murray"
                legalName:
                  type: string
                  description: Optional field if the applicant has a legal name different from their known by names.
                  example: "Abraham Murray"
                countryCode:
                  type: string
                  description: Locality of applicant. Use ISO 3166-1 alpha-2 strings format.
                  example: "MT"
                locale:
                  type: string
                  description: Language preference of the applicant. Defaults to English if unspecified or unsupported.
                  example: "MT"
                gender:
                  type: string
                  enum: [Male, Female, Non-Binary, Prefer not to say]
                  description: Gender of the applicant.
                  example: "Male"
                dateOfBirth:
                  type: string
                  format: date
                  description: Date of birth of applicant in YYYY-MM-DD format.
                  example: "1975-06-12"
                placeOfBirth:
                  type: string
                  description: Birthplace of the applicant.
                  example: "London"
                countryOfBirth:
                  type: string
                  description: Country of birth of the applicant, using ISO 3166-1 alpha-2 format.
                  example: "United Kingdom"
                addressLine1:
                  type: string
                  description: Primary address line for the applicant.
                  example: "House Name"
                addressLine2:
                  type: string
                  description: Secondary address line for the applicant.
                  example: "New Road"
                postCode:
                  type: string
                  description: Postal code for the applicant's address.
                  example: "SLM1024"
                country:
                  type: string
                  description: Country of the applicant, using ISO 3166-1 alpha-2 format.
                  example: "MT"
                nationality:
                  type: string
                  description: The nationality of the applicant.
                customFields:
                  type: object
                  description: >
                    Optional custom field values, split by the record they belong to. Keys must match the custom
                    field sets configured for the case type; unknown keys are ignored.
                  properties:
                    case:
                      type: object
                      additionalProperties: true
                    person:
                      type: object
                      additionalProperties: true
              required:
                - referenceId

            examples:
              InitCaseExample:
                summary: Example request to initiate a new case (Person)
                value:
                  caseTypeId: "unique_id"
                  referenceId: "UniqueReferenceABCD01"
                  description: "This is the description field"
                  email: "test@arritech.com"
                  mobile: "+35679000000"
                  title: "Mr"
                  firstName: "Abraham"
                  lastName: "Murray"
                  legalName: ""
                  countryCode: "MT"
                  locale: "EN"
                  gender: "Male"
                  dateOfBirth: "1986-12-12"
                  placeOfBirth: ""
                  countryOfBirth: "MT"
                  addressLine1: ""
                  addressLine2: ""
                  postCode: ""
                  country: "MT"
                  nationality: "Maltese"
              InitCaseCompanyExample:
                summary: Example request to initiate a new case (Company)
                value:
                  caseTypeId: "unique_id"
                  referenceId: "UniqueReferenceCompany01"
                  description: "Company onboarding"
                  entityType: "company"
                  email: "billing@acmewidgets.example"
                  company:
                    name: "Acme Widgets Ltd"
                    tradeName: "Acme"
                    regNum: "12345678"
                    regDate: "2015-03-14"
                    regCountry: "MT"
                    businessType: "Retail"
                    companyType: "Ltd"
                    vatNum: "MT12345678"
                    repName: "Abraham Murray"
                    repEmailAddress: "abraham@acmewidgets.example"
                    repPhoneNum: "+35679000000"
                    compEmailAddress: "hello@acmewidgets.example"
                    compPhoneNum: "+35621000000"
                    compStatus: "Active"

      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: True if the token was generated successfully. False otherwise
                  data:
                    type: object
                    description: In case of an error, this object will be set to 'null'
                    properties:
                      caseId:
                        type: string
                        description: The ID of the case the session was created against.
                      entityId:
                        type: string
                        description: The ID of the entity the session was created against.
                      entityType:
                        type: string
                        enum: [person, company]
                        description: Kind of entity the session was opened against. Echoes the request's `entityType` (defaults to `person`).
                      journeyId:
                        type: string
                        description: The ID of the journey the session runs.
                      sessionId:
                        type: string
                        description: the unique session id that makes the CFM url unique. This session expires as per setting in QGoL General settings. Should be returned to the frontend to start cfm process.
                      cfmUrl:
                        type: string
                        description: the URL with the unique session id that makes the CFM url unique.
                  errors:
                    type: array
                    nullable: true
                    description: Array of error object types. If the request was successful, this object will be set to 'null'
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          description: The HTML error reason code. Includes 400 (bad request), 401 (Unauthorized)
                        message:
                          type: string
                          description: A descriptive message describing the reason for the error
              example:
                success: true
                data:
                  caseId: unique_id
                  entityId: unique_id
                  entityType: person
                  journeyId: unique_id
                  sessionId: unique_id
                  cfmUrl: https://qgenonlinedev.com/cfm/?session_id=unique_id
                errors: null
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Set to false if not successful
                  data:
                    type: object
                  errors:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          description: Http error code
                        message:
                          type: string
                          description: error message
              example:
                success: false
                data: null
                errors:
                  - code: 400
                    message: invalid character '\\n' in string literal

  /v1/cfm/session/init:
    post:
      tags:
        - cfm
      summary: Initialize a session for the CFM API using an existing case.
      description: |
        This endpoint initializes a session for the CFM API using the provided case details and applicant's information. 
        Use it to kickstart an interaction or workflow within the CFM component.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                caseId:
                  type: string
                  description: The unique ID of the case. Required.
                  example: "unique_id"
                entityId:
                  type: string
                  description: The unique ID of the entity associated with the case. Required.
                  example: "unique_id"
                riskLevelId:
                  type: string
                  description: The risk level ID for the applicant. Required.
                  example: "unique_id"
                locale:
                  type: string
                  description: Language preference for the session. Defaults to English if unspecified.
                  example: "en"
              required:
                - caseId
                - entityId
                - riskLevelId
            examples:
              InitSessionExample:
                summary: Example request to initialize a session
                value:
                  caseId: "unique_id"
                  entityId: "unique_id"
                  riskLevelId: "unique_id"
                  locale: "en"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: True if the token was generated successfully. False otherwise
                  data:
                    type: object
                    description: In case of an error, this object will be set to 'null'
                    properties:
                      caseId:
                        type: string
                        description: The ID of the case the session was created against.
                      entityId:
                        type: string
                        description: The ID of the entity the session was created against.
                      entityType:
                        type: string
                        enum: [person, company]
                        description: Kind of entity the session belongs to. Reflects the entity type set when the case or entity was first initialised.
                      journeyId:
                        type: string
                        description: The ID of the journey the session runs.
                      sessionId:
                        type: string
                        description: the unique session id that makes the CFM url unique. This session expires as per setting in QGoL General settings. Should be returned to the frontend to start cfm process.
                      cfmUrl:
                        type: string
                        description: the URL with the unique session id that makes the CFM url unique.
                  errors:
                    type: array
                    nullable: true
                    description: Array of error object types. If the request was successful, this object will be set to 'null'
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          description: The HTML error reason code. Includes 400 (bad request), 401 (Unauthorized)
                        message:
                          type: string
                          description: A descriptive message describing the reason for the error
              example:
                success: true
                data:
                  caseId: unique_id
                  entityId: unique_id
                  entityType: person
                  journeyId: unique_id
                  sessionId: unique_id
                  cfmUrl: https://qgenonlinedev.com/cfm/?session_id=unique_id
                errors: null
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Always false for bad requests.
                  data:
                    type: object
                    nullable: true
                  errors:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          description: HTTP error code.
                        message:
                          type: string
                          description: A descriptive error message.
              example:
                success: false
                data: null
                errors:
                  - code: 400
                    message: "caseId - Value must be a valid bson object ID"

  /v1/cfm/case/types:
    get:
      tags:
        - cfm
      summary: Retrieve available case types.
      description: >
        Returns the merchant's case types together with the risk level configured for each, newest first. Only
        case types that have a risk level relation are returned, since a case type without one cannot start a
        CFM session.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The merchant's case types with their risk levels.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      caseTypes:
                        type: array
                        items:
                          $ref: "#/components/schemas/CaseType"
                  errors:
                    type: array
                    nullable: true
                    items:
                      type: object
              example:
                success: true
                data:
                  caseTypes:
                    - id: unique_id
                      name: Passport Check
                      group: Onboarding
                      customFieldSetId: null
                      riskLevel:
                        id: unique_id
                        name: Standard
                        applyOCRDuringFastFail: true
                errors: null
  /v1/case/case/{caseID}:
    get:
      tags:
        - cfm
      summary: Get detailed information about a specific case by its ID.
      description: |
        Returns the full case payload including all Person and Company entities, and a `files[]` array of documents
        uploaded manually against the case (documents that are not part of a CFM flow). Each file entry carries
        `id`, `fileName`, `entityId` (a string when the document was uploaded against a specific entity, or `null`
        when uploaded against the case itself), and the standard `audit` block.

        Every AML search linked to an entity also appears in that entity's `documents[]` array as an entry with
        `documentType: "AML Screening"`, alongside the identity, selfie and form documents. It carries the search's
        verification `currentStatus`, the `statuses[]` history and the reviewer's notes, in the same shape as every
        other reviewable document. This applies to searches linked before the feature shipped too — existing links
        were backfilled.

        `files[]` on that entry holds the AML certificate when one was produced. Searches created through
        `POST /v1/aml/search` or linked with `POST /v1/case/cases/{caseid}/{entityid}/{complyid}/link` produce no
        certificate, so their `files[]` is empty; searches run as part of a CFM journey normally have one. The
        entity's `searches[]` array remains the place to read the AML search itself (`complySearchId`, `searchTerm`,
        `hits`); note that the `documents[]` entry does not repeat those fields, so when an entity has more than one
        linked search the certificate in `files[]` is what ties an entry to a particular search.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: caseID
          required: true
          schema:
            type: string
          description: The ID of the case to retrieve.
      responses:
        "200":
          description: Raw JSON containing detailed case information.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              examples:
