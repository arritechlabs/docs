                  tradeName: "Acme"
                  regNum: "C12345"
                  regDate: "2010-03-15"
                  regCountry: "MT"
                  addressLine1: "Level 3, Tower Business Centre"
                  addressLine2: "Tower Street"
                  postCode: "SWTR1234"
                  country: "MT"
                  businessType: "Financial Services"
                  companyType: "Private Limited Company"
                  vatNum: "MT12345678"
                  repName: "Jane Borg"
                  repEmailAddress: "jane.borg@acme.example"
                  repPhoneNum: "+35679111111"
                  compPhoneNum: "+35621222333"
                  compEmailAddress: "info@acme.example"
                  compStatus: "Active"
                  uniqueCheck: false
                  customFields:
                    industryCode: "K64"
      responses:
        "200":
          description: Company created and linked to the case successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: True when the company was created successfully.
                  data:
                    type: object
                    description: Set to 'null' in case of an error.
                    properties:
                      id:
                        type: string
                        description: The ObjectId of the newly created company.
                  errors:
                    type: array
                    nullable: true
                    description: Set to 'null' when the request is successful.
                    items:
                      type: object
              example:
                success: true
                data:
                  id: "64b1f0a2c9e77aabcd987654"
                errors: null
        "400":
          description: Bad Request - Missing required field, invalid caseid, or a malformed value.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          format: int32
                        message:
                          type: string
              examples:
                badRequestExample:
                  value:
                    {
                      "success": false,
                      "data": null,
                      "errors":
                        [
                          {
                            "code": 400,
                            "message": "name - Value must not be empty",
                          },
                        ],
                    }
        "401":
          description: >
            Unauthorized - the token is missing, invalid or expired, or it does not hold the required
            **case:operator** role. A missing role is reported as a 401, not a 403.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    nullable: true
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          format: int32
                        message:
                          type: string
              examples:
                unauthorizedExample:
                  value:
                    {
                      "success": false,
                      "data": null,
                      "errors":
                        [
                          {
                            "code": 401,
                            "message": "invalid token secret",
                          },
                        ],
                    }
                missingRoleExample:
                  value:
                    {
                      "success": false,
                      "data": null,
                      "errors":
                        [
                          {
                            "code": 401,
                            "message": "Unauthorized Access - Missing role",
                          },
                        ],
                    }
        "409":
          description: Conflict - uniqueCheck was set and a company with the same registration number already exists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          format: int32
                        message:
                          type: string
              examples:
                conflictExample:
                  value:
                    {
                      "success": false,
                      "data": null,
                      "errors":
                        [
                          {
                            "code": 409,
                            "message": "company already exists with registration num: C12345",
                          },
                        ],
                    }
